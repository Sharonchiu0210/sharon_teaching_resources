<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼字單位聽音練習</title>

<style>
/* layout: one narrow reading column, sticky control bar, rule card on top, 國中 list then 高中延伸 below */
:root{
  --bg:#f6f1ea; --paper:#fffdf9; --ink:#2f2520; --soft:#77685d; --line:#e1d5c8;
  --sound:#55738c; --sound-soft:#e2eaf1; --clay:#a3522f; --clay-soft:#f4e3d8; --ok:#4f7448; --no:#a8402f;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-word:"Lexend","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1916; --paper:#29221e; --ink:#efe6dc; --soft:#b3a497; --line:#41372f;
  --sound:#9fb9cd; --sound-soft:#2e3a44; --clay:#e09a78; --clay-soft:#3d2a21; --ok:#9cc08f; --no:#e5917f; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1e1916; --paper:#29221e; --ink:#efe6dc; --soft:#b3a497; --line:#41372f;
  --sound:#9fb9cd; --sound-soft:#2e3a44; --clay:#e09a78; --clay-soft:#3d2a21; --ok:#9cc08f; --no:#e5917f; color-scheme:dark; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); -webkit-text-size-adjust:100%; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
.wrap{ max-width:660px; margin:0 auto; padding-block:16px 60px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
header h1{ font-size:14px; font-weight:500; color:var(--soft); margin:4px 0 2px; letter-spacing:.06em; }
.ukey{ font-family:var(--f-word); font-size:13px; font-weight:600; color:var(--clay); letter-spacing:.08em; }
.unit-title{ font-size:24px; font-weight:800; margin:2px 0 2px; line-height:1.35; text-wrap:balance; }
.unit-sub{ font-size:15px; color:var(--soft); margin-bottom:12px; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 12px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:18px; padding:7px 12px; font-size:14px; cursor:pointer; font-family:inherit; }
.chip b{ font-family:var(--f-word); font-weight:600; margin-right:4px; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.rule{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.75; margin:0 0 12px; }
.rule strong{ color:var(--clay); font-weight:700; margin-right:6px; }
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:8px 0 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); }
.seg{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); }
.seg button{ border:0; background:none; padding:8px 12px; font-size:14px; color:var(--soft); font-family:inherit; cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--sound-soft); color:var(--ink); font-weight:700; }
.spacer{ flex:1; }
.playall{ border:0; background:var(--sound); color:var(--paper); border-radius:10px; padding:9px 14px; font-size:14px; font-family:inherit; cursor:pointer; }
.grp{ margin-top:18px; }
.grp h3{ font-size:15px; font-weight:700; margin:0 0 2px; color:var(--ink); display:flex; align-items:baseline; gap:8px; }
.grp h3 .n{ font-size:12px; font-weight:400; color:var(--soft); }
ul.words{ list-style:none; margin:0; padding:0; }
.row{ display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
.row .w{ font-size:22px; letter-spacing:.02em; font-family:var(--f-word); min-width:0; overflow-wrap:anywhere; }
.u{ color:var(--clay); font-weight:600; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px; }
.row .zh{ font-size:13px; color:var(--soft); margin-left:auto; text-align:right; flex:none; max-width:42%; }
.spk{ flex:none; width:38px; height:38px; border-radius:50%; border:0; background:var(--sound-soft); color:var(--sound); display:grid; place-items:center; cursor:pointer; }
.spk svg{ width:19px; height:19px; }
.row.on .spk{ background:var(--sound); color:var(--paper); }
.hs-head{ margin-top:34px; padding-top:14px; border-top:2px solid var(--ink); }
.hs-head h2{ font-size:18px; margin:0 0 4px; }
.hs-head p{ margin:0; font-size:13px; color:var(--soft); line-height:1.7; }
.hs .row .w{ font-size:19px; }
.note{ font-size:13px; color:var(--soft); line-height:1.7; margin:12px 0 0; }
.warn{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.7; margin:12px 0; }
.pool{ display:flex; justify-content:center; margin-top:16px; }
.dict{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px 18px; margin-top:12px; text-align:center; }
.dcount{ font-size:13px; color:var(--soft); }
.bigplay{ width:84px; height:84px; border-radius:50%; border:0; background:var(--sound); color:var(--paper); margin:16px auto 8px; display:grid; place-items:center; cursor:pointer; }
.bigplay svg{ width:38px; height:38px; }
.hints{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; min-height:24px; }
.hintbtn{ border:0; background:none; color:var(--sound); font-size:14px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:2px; }
.hintout{ font-size:16px; color:var(--soft); min-height:30px; margin-top:6px; }
.hintout .gap{ font-family:var(--f-word); font-size:22px; letter-spacing:.12em; color:var(--ink); }
.answer{ width:100%; max-width:320px; font-size:24px; text-align:center; padding:10px; border:0; border-bottom:2px solid var(--ink); background:transparent; color:var(--ink); margin:10px auto 6px; display:block; font-family:var(--f-word); }
.answer:focus{ outline:none; border-bottom-color:var(--sound); }
.actions{ display:flex; gap:10px; justify-content:center; margin-top:14px; }
.btn{ border:1px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:10px; padding:10px 20px; font-size:15px; font-family:inherit; cursor:pointer; }
.btn.ghost{ background:none; color:var(--ink); }
.result{ min-height:56px; margin-top:12px; font-size:16px; line-height:1.6; }
.result .ok{ color:var(--ok); font-weight:700; }
.result .no{ color:var(--no); font-weight:700; }
.result .rightw{ font-size:24px; font-family:var(--f-word); letter-spacing:.03em; }
.result .glab{ font-size:13px; color:var(--soft); }
.summary h3{ margin:4px 0 6px; font-size:22px; font-family:var(--f-word); }
.miss{ text-align:left; margin:12px auto 0; max-width:340px; font-size:15px; line-height:1.9; }
.miss .w{ font-family:var(--f-word); font-size:17px; }
button:focus-visible,.chip:focus-visible{ outline:2px solid var(--sound); outline-offset:2px; }
footer{ margin-top:28px; font-size:12px; color:var(--soft); text-align:center; }
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto!important; } }
</style>

</head>
<body>
<div class="wrap">
<header>
  <h1>拼字單位聽音練習｜國二銜接高一</h1>
  <div class="ukey" id="ukey"></div>
  <div class="unit-title" id="utitle"></div>
  <div class="unit-sub" id="usub"></div>
</header>
<nav class="chips" id="chips" aria-label="選擇課次"></nav>
<div class="rule" id="rule"></div>
<div class="warn" id="warn" hidden>這個瀏覽器無法播放語音。請改用手機內建的 Safari（iPhone）或 Chrome（Android）開啟。</div>
<div class="bar">
  <div class="seg" role="group" aria-label="模式">
    <button id="mListen" aria-pressed="true">聽讀</button>
    <button id="mDict" aria-pressed="false">聽寫</button>
  </div>
  <div class="seg" role="group" aria-label="語速">
    <button id="sN" aria-pressed="true">正常</button>
    <button id="sS" aria-pressed="false">慢速</button>
  </div>
  <div class="spacer"></div>
  <button class="playall" id="playall">播放國中字</button>
</div>
<section id="listen">
  <p class="note">點單字就會念出來。底線標出的是這一課要練的拼字單位，先聽，再看它怎麼寫。</p>
  <div id="jhlist"></div>
  <div class="hs" id="hsblock">
    <div class="hs-head"><h2>高中延伸</h2><p>同一條規則的高中字，當參考。國中字熟了再往下聽，聽寫也可以把這些字加進去。</p></div>
    <div id="hslist"></div>
  </div>
</section>
<section id="dict" hidden>
  <div class="pool"><div class="seg" role="group" aria-label="出題範圍">
    <button id="pJ" aria-pressed="true">只考國中字</button>
    <button id="pA" aria-pressed="false">加入高中字</button>
  </div></div>
  <div class="dict" id="dbox"></div>
</section>
<footer>英語創意發想社｜Sharon Chiu</footer>

<script>
const DATA = [{"key":"A1","title":"ay、ai、ey 都唸 /e/","sub":"看它在字的哪裡","sound":"/e/","rule":"/e/ 在字尾常寫 ay，在字中常寫 ai；加 -s、-ed、-ing 時保留 ay（played、playing）。ey 是少數派，直接背。","groups":[{"label":"ay（多在字尾）","jh":[["day","天",1,3],["play","玩",2,4],["stay","停留",2,4],["holiday","假日",5,7]],"hs":[["delay","延誤",3,5],["display","展示",5,7],["essay","短文",3,5],["railway","鐵路",5,7],["hallway","走廊",5,7],["spray","噴灑",3,5],["tray","托盤",2,4],["portray","描繪",5,7]]},{"label":"ai（多在字中）","jh":[["rain","雨",1,3],["wait","等待",1,3],["train","火車",2,4],["paint","油漆、畫",1,3],["afraid","害怕的",3,5],["explain","解釋",4,6],["maintain","維持",1,3],["complain","抱怨",5,7],["claim","宣稱",2,4],["praise","稱讚",2,4]],"hs":[["aid","援助",0,2],["daily","每日的",1,3],["detail","細節",3,5],["failure","失敗",1,3],["grain","穀物",2,4],["contain","包含",4,6],["chain","鏈子",2,4],["faint","昏倒",1,3],["faith","信念",1,3],["jail","監獄",1,3],["trail","小徑",2,4],["drain","排水",2,4],["remain","保持、剩下",3,5],["obtain","獲得",3,5],["retain","保留",3,5],["entertain","娛樂",6,8],["campaign","活動",4,6]]},{"label":"ey（少數派）","jh":[["they","他們",2,4],["obey","服從",2,4]],"hs":[["survey","調查",4,6],["convey","傳達",4,6]]},{"label":"eigh（gh 不發音）","jh":[["eight","八",0,4],["weight","重量",1,5],["neighbor","鄰居",1,5]],"hs":[["weigh","秤重",1,5],["neighborhood","鄰近地區",1,5]]}]},{"key":"A2","title":"ee、ea、ie 都唸 /i/","sub":"找短音親戚","sound":"/i/","rule":"ee 和 ea 聽不出差別，但 ea 的字常有短音親戚：please → pleasant、heal → health。","groups":[{"label":"ee","jh":[["feel","感覺",1,3],["meet","遇見",1,3],["need","需要",1,3],["agree","同意",3,5],["degree","程度",4,6],["green","綠色",2,4],["free","自由的",2,4],["seed","種子",1,3]],"hs":[["indeed","確實",3,5],["employee","員工",6,8],["steel","鋼",2,4],["breeze","微風",2,4],["cheek","臉頰",2,4],["freeze","結冰",2,4],["sleeve","袖子",2,4],["squeeze","擠壓",3,5],["steep","陡峭的",2,4],["keen","熱衷的",1,3],["breed","繁殖",2,4],["refugee","難民",5,7],["guarantee","保證",7,9]]},{"label":"ea","jh":[["sea","海",1,3],["eat","吃",0,2],["teach","教",1,3],["speak","說",2,4],["beach","海灘",1,3],["dream","夢",2,4],["reason","理由",1,3 const U = ()=>DATA[unit];
function jhWords(){ return U().groups.flatMap(g=>g.jh.map(x=>[...x,g.label])); }
function allWords(){ return U().groups.flatMap(g=>[...g.jh,...g.hs].map(x=>[...x,g.label])); }
function renderChips(){
  const c = document.getElementById('chips'); c.innerHTML='';
  DATA.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='chip';
    b.innerHTML = `<b>${d.key}</b>${esc(d.sound)}`;
    b.setAttribute('aria-pressed', i===unit);
    b.onclick=()=>{ stopAll(); unit=i; render(); b.scrollIntoView({inline:'center',block:'nearest'}); };
    c.appendChild(b);
  });
  const on=c.children[unit]; if(on) setTimeout(()=>on.scrollIntoView({inline:'center',block:'nearest'}),50);
}
let rowSeq = 0;
function groupHTML(g, side){
  const ws = g[side]; if(!ws.length) return '';
  const lis = ws.map(([w,z,a,b])=>{ const id=rowSeq++; return `<li class="row" data-i="${id}" data-w="${esc(w)}"><button class="spk" aria-label="播放 ${esc(w)}">${SPK}</button><span class="w">${hl(w,a,b)}</span><span class="zh">${esc(z)}</span></li>`; }).join('');
  return `<div class="grp"><h3>${esc(g.label)}<span class="n">${ws.length} 字</span></h3><ul class="words">${lis}</ul></div>`;
}
function renderLists(){
  rowSeq = 0;
  document.getElementById('jhlist').innerHTML = U().groups.map(g=>groupHTML(g,'jh')).join('');
  const hs = U().groups.map(g=>groupHTML(g,'hs')).join('');
  document.getElementById('hslist').innerHTML = hs;
  document.querySelectorAll('.row').forEach(li=>{
    li.onclick=()=>{ stopAll(); const i=+li.dataset.i; mark(i); say(li.dataset.w,()=>mark(-1)); };
  });
}
function mark(i){ document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on', +r.dataset.i===i)); }
function stopAll(){ playing=false; if(synth) synth.cancel(); mark(-1); document.getElementById('playall').textContent='播放國中字'; }
document.getElementById('playall').onclick=()=>{
  if(playing){ stopAll(); return; }
  playing=true; document.getElementById('playall').textContent='停止';
  const rows=[...document.querySelectorAll('#jhlist .row')]; let i=0;
  const next=()=>{ if(!playing||i>=rows.length){ stopAll(); return; }
    const r=rows[i]; mark(+r.dataset.i); r.scrollIntoView({block:'center',behavior:'smooth'});
    say(r.dataset.w,()=>{ i++; setTimeout(next, 900); }); };
  next();
};
let dq=[], di=0, miss=[], checked=false;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newRound(){ dq=shuffle(pool==='jh'?jhWords():allWords()).slice(0,10); di=0; miss=[]; drawQ(); }
function drawQ(){
  const box=document.getElementById('dbox'); checked=false;
  if(di>=dq.length){
    const score=dq.length-miss.length;
    box.innerHTML=`<div class="summary"><h3>${score} / ${dq.length}</h3><div class="dcount">${miss.length? '寫錯的字，看底線那一段，想想是哪一條規則：':'全對。再來一組，或加入高中字。'}</div>
      ${miss.length? '<div class="miss">'+miss.map(([w,z,a,b,lab,ans])=>`<span class="w">${hl(w,a,b)}</span>　<span style="color:var(--soft)">${esc(z)}｜你寫 ${esc(ans)||'（空白）'}</span>`).join('<br>')+'</div>':''}
      <div class="actions"><button class="btn" id="again">再來一組</button></div></div>`;
    document.getElementById('again').onclick=newRound; return;
  }
  const [w,z,a,b,lab]=dq[di];
  box.innerHTML=`<div class="dcount">第 ${di+1} 題 / 共 ${dq.length} 題</div>
    <button class="bigplay" id="bp" aria-label="播放">${SPK}</button>
    <div class="hints"><button class="hintbtn" id="h2">看挖空</button></div>
    <div class="hintout" id="hout"></div>
    <input class="answer" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="寫出你聽到的字">
    <div class="actions"><button class="btn ghost" id="rep">再聽一次</button><button class="btn" id="chk">檢查</button></div>
    <div class="result" id="res"></div>`;
  const play=()=>say(w);
  document.getElementById('bp').onclick=play; document.getElementById('rep').onclick=play;
  const out=document.getElementById('hout'); let shown={zh:true};
  const showHints=()=>{ out.innerHTML=[shown.zh?esc(z):'', shown.gap?`<span class="gap">${gapped(w,a,b)}</span>`:''].filter(Boolean).join('　'); };
  showHints();
  document.getElementById('h2').onclick=()=>{ shown.gap=true; showHints(); };
  const ans=document.getElementById('ans'), chk=document.getElementById('chk');
  const go=()=>{
    if(checked){ di++; drawQ(); return; }
    const v=ans.value.trim().toLowerCase(); checked=true;
    const res=document.getElementById('res');
    if(v===w.toLowerCase()){ res.innerHTML=`<span class="ok">正確</span><br><span class="rightw">${hl(w,a,b)}</span>`; }
    else { miss.push([w,z,a,b,lab,v]); res.innerHTML=`<span class="no">再看一次</span><br><span class="rightw">${hl(w,a,b)}</span><br><span class="glab">${esc(lab)}</span>`; }
    chk.textContent = di===dq.length-1 ? '看成績' : '下一題';
  };
  chk.onclick=go; ans.onkeydown=e=>{ if(e.key==='Enter') go(); };
  setTimeout(play, 250);
}
function setPool(p){ pool=p; document.getElementById('pJ').setAttribute('aria-pressed',p==='jh'); document.getElementById('pA').setAttribute('aria-pressed',p==='all'); newRound(); }
document.getElementById('pJ').onclick=()=>setPool('jh');
document.getElementById('pA').onclick=()=>setPool('all');
function setMode(m){
  stopAll(); mode=m;
  document.getElementById('mListen').setAttribute('aria-pressed', m==='listen');
  document.getElementById('mDict').setAttribute('aria-pressed', m==='dict');
  document.getElementById('listen').hidden = m!=='listen';
  document.getElementById('dict').hidden = m!=='dict';
  document.getElementById('playall').style.visibility = m==='listen'?'visible':'hidden';
  if(m==='dict') newRound();
}
document.getElementById('mListen').onclick=()=>setMode('listen');
document.getElementById('mDict').onclick=()=>setMode('dict');
function setRate(r){ rate=r; document.getElementById('sN').setAttribute('aria-pressed', r>0.8); document.getElementById('sS').setAttribute('aria-pressed', r<=0.8); }
document.getElementById('sN').onclick=()=>setRate(0.9);
document.getElementById('sS').onclick=()=>setRate(0.6);
function render(){
  const d=U();
  document.getElementById('ukey').textContent = d.key + '　' + d.sound;
  document.getElementById('utitle').textContent = d.title;
  document.getElementById('usub').textContent = d.sub;
  document.getElementById('rule').innerHTML = '<strong>規則</strong>' + esc(d.rule);
  renderChips(); renderLists();
  document.getElementById('hsblock').hidden = !d.groups.some(g=>g.hs.length);
  if(mode==='dict') newRound();
  try{ history.replaceState(null,'','#'+d.key.toLowerCase()); }catch(e){}
}
render();
</script>
</body>
</html>
