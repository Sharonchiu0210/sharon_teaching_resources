const KEY='l1l2-115-strip-flipped';

function save(){try{localStorage.setItem(KEY,JSON.stringify([...flipped]))}catch(e){}}
const groups=[...new Set(DATA.map(d=>d[0]))];

let cur='全部', weakOnly=false;
const secs=document.getElementById('secs');

let voiceOn=true, enVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();enVoice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
  if(!voiceOn||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  text=text.replace(/\bsth\./g,'something').replace(/\bsb\./g,'somebody').replace(/V-ing/g,'doing').replace(/\.\.\.|……/g,' ').replace(/\s+/g,' ').trim();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.85;if(enVoice)u.voice=enVoice;
  speechSynthesis.speak(u);
}
function blank(w){return w.length<3?'_ _':w[0]+' '+'_ '.repeat(w.length-2)+w[w.length-1]}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
const main=document.getElementById('main');
function render(){
  main.innerHTML='';
  let any=false;
  groups.forEach(g=>{
    if(cur!=='全部'&&cur!==g) return;
    const rows=DATA.map((d,i)=>({d,n:i+1})).filter(x=>x.d[0]===g&&(!weakOnly||flipped.has(x.n)));
    if(!rows.length) return; any=true;
    const h=document.createElement('h2');h.textContent=g;main.appendChild(h);
    const list=document.createElement('div');list.className='list';
    rows.forEach(({d,n})=>{
      const [,zh,pre,key,post]=d;
      const r=document.createElement('div');r.className='row';r.dataset.n=n;
      r.innerHTML=`<div class="q"><span class="n">${n}.</span><span><span class="zh">${esc(zh)}</span><span class="en">${esc(pre)}<span class="blank">${blank(key)}</span>${esc(post)}</span></span></div><button class="a" aria-label="第${n}題答案"><span class="hint">點我看答案</span><span class="word">${esc(key)}</span></button>`;

        const open=r.classList.toggle('open');
        r.querySelector('.blank').textContent=open?key:blank(key);
        if(open){flipped.add(n);save();upd();speak(pre+key+post);}
      };
      list.appendChild(r);
    });
    main.appendChild(list);
  });

}
function upd(){document.getElementById('cnt').textContent=flipped.size}
function setAll(open){document.querySelectorAll('.row').forEach(r=>{const d=DATA[r.dataset.n-1];r.classList.toggle('open',open);r.querySelector('.blank').textContent=open?d[3]:blank(d[3]);})}

document.getElementById('hideAll').onclick=()=>setAll(false);
const wb=document.getElementById('weak');
wb.onclick=()=>{weakOnly=!weakOnly;wb.classList.toggle('on',weakOnly);wb.setAttribute('aria-pressed',weakOnly);render()};
const vb=document.getElementById('voice');
