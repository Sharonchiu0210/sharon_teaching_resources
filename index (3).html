<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三大子句線上題庫｜Sharon Grammar Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE4; --card:#FBF8F2; --ink:#3E2C22; --soft:#7A6455; --line:#E2D6C5;
  --fur:#A87A55; --fur2:#D3B28E; --nose:#5A3F30; --water:#A7BEC6; --water2:#8FAAB4;
  --yuzu:#DFAD3B; --ok:#5F8463; --okbg:#E7EFE3; --bad:#B0614A; --badbg:#F5E4DC;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --title:"Noto Serif TC","Songti TC","PMingLiU",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#231C17; --card:#2D241E; --ink:#EFE4D6; --soft:#B9A693; --line:#45382E;
  --fur:#9C7250; --fur2:#C2A27F; --nose:#3A2A20; --water:#4F6A74; --water2:#41595F;
  --okbg:#2E3A2D; --ok:#9CC09A; --badbg:#41291F; --bad:#E39A80;}}
:root[data-theme="dark"]{
  --paper:#231C17; --card:#2D241E; --ink:#EFE4D6; --soft:#B9A693; --line:#45382E;
  --fur:#9C7250; --fur2:#C2A27F; --nose:#3A2A20; --water:#4F6A74; --water2:#41595F;
  --okbg:#2E3A2D; --ok:#9CC09A; --badbg:#41291F; --bad:#E39A80;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:16px 18px 48px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 2px 6px}
.brand{font-family:var(--title);font-size:1.05rem;font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--soft);letter-spacing:0}
.meta{font-size:.85rem;color:var(--soft);text-align:right;white-space:nowrap}
.meta b{color:var(--ink);font-size:1.05rem}

/* onsen scene */
.scene{position:relative;margin:6px 0 14px}
.scene svg{display:block;width:100%;height:auto}
.speech{position:absolute;left:62%;top:8%;max-width:38%;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 11px;font-size:.84rem;line-height:1.45}
.plus{position:absolute;left:47%;top:2%;font-weight:700;color:var(--yuzu);opacity:0;pointer-events:none}
.plus.go{animation:plus .9s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(10px)}25%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.cap .eye-happy,.cap .sweat{display:none}
.cap.happy .eye-open{display:none}.cap.happy .eye-happy{display:inline}
.cap.oops .sweat{display:inline}
.cap.happy .head{animation:bob .6s ease-in-out}
@keyframes bob{50%{transform:translateY(-4px)}}
.steam path{animation:steam 4s ease-in-out infinite;opacity:.55}
.steam path:nth-child(2){animation-delay:1.3s}.steam path:nth-child(3){animation-delay:2.6s}
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.55}100%{transform:translateY(-10px);opacity:0}}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--fur);transition:width .3s}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px}
.tag{font-size:.78rem;color:var(--soft);margin-bottom:8px}
.qnum{font-family:var(--title);font-weight:700;margin-right:.4em}
.stem{font-family:var(--serif);font-size:1.12rem;line-height:1.75;margin:0 0 14px}
.stem .zh,.zhq{font-family:var(--sans);font-size:1rem}
.passage{font-family:var(--serif);font-size:1rem;line-height:1.85;background:var(--paper);border-radius:12px;padding:12px 14px;margin:0 0 14px;max-height:46vh;overflow:auto}
.passage h3{font-family:var(--serif);font-size:.95rem;margin:0 0 6px;color:var(--soft);font-weight:600}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:1.5px solid var(--soft);color:var(--soft);font-size:.8em;line-height:1.3}
.blank.now{border-bottom:2.5px solid var(--yuzu);color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--yuzu) 22%,transparent);border-radius:4px 4px 0 0}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--fur2)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--water2);outline-offset:2px}
.opt .k{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--card);border:1px solid var(--line)}
.opt .t{font-family:var(--serif);font-size:1.02rem;padding-top:.1em}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .k{background:var(--ok);color:var(--card);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .k{background:var(--bad);color:var(--card);border-color:var(--bad)}
.exp{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:.95rem}
.exp .verdict{font-weight:700;margin-bottom:6px}
.exp .verdict.ok{color:var(--ok)}.exp .verdict.no{color:var(--bad)}
.exp p{margin:.35em 0}
.exp .lb{display:inline-block;font-size:.78rem;font-weight:700;color:var(--fur);margin-right:.4em}
.row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--line);font-weight:500}
.hidden{display:none!important}
.intro h1{font-family:var(--title);font-size:1.5rem;line-height:1.35;margin:0 0 6px}
.intro p{margin:0 0 14px;color:var(--soft);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--fur);background:var(--fur);color:var(--card)}
.chip small{opacity:.75;margin-left:.3em}
.best{font-size:.85rem;color:var(--soft);margin-top:10px}
.big{font-family:var(--title);font-size:3rem;font-weight:700;line-height:1}
.big span{font-size:1rem;color:var(--soft);font-weight:400;margin-left:.3em}
.review{margin-top:18px}
.review details{border-top:1px solid var(--line);padding:10px 0}
.review summary{cursor:pointer;font-size:.92rem}
.review summary .s{font-family:var(--serif)}
.review .exp{border:0;padding-top:6px;margin-top:4px}
.small{font-size:.8rem;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">三大子句線上題庫<small>Sharon Grammar Lab</small></div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 360 170">
      <g class="steam" stroke="var(--soft)" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M70 70c-6-8 6-14 0-22"/><path d="M285 74c-6-8 6-14 0-22"/><path d="M250 60c-6-8 6-14 0-22"/>
      </g>
      <ellipse cx="180" cy="150" rx="176" ry="30" fill="var(--water2)"/>
      <g class="cap" id="cap">
        <g class="head">
          <ellipse cx="180" cy="140" rx="62" ry="26" fill="var(--fur)"/>
          <rect x="128" y="42" width="104" height="96" rx="44" fill="var(--fur)"/>
          <ellipse cx="141" cy="48" rx="9" ry="7" fill="var(--nose)"/><ellipse cx="219" cy="48" rx="9" ry="7" fill="var(--nose)"/>
          <ellipse cx="180" cy="114" rx="40" ry="24" fill="var(--fur2)"/>
          <ellipse cx="170" cy="106" rx="4" ry="2.6" fill="var(--nose)"/><ellipse cx="190" cy="106" rx="4" ry="2.6" fill="var(--nose)"/>
          <path d="M172 122q8 5 16 0" stroke="var(--nose)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <g class="eye-open" fill="var(--nose)"><circle cx="156" cy="82" r="4.2"/><circle cx="204" cy="82" r="4.2"/></g>
          <g class="eye-happy" stroke="var(--nose)" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M150 84q6-7 12 0"/><path d="M198 84q6-7 12 0"/></g>
          <path class="sweat" d="M236 70q6 10 0 14q-6-4 0-14z" fill="var(--water)"/>
          <g transform="translate(180 30)"><circle r="14" fill="var(--yuzu)"/><path d="M0-13q8-8 14-3q-8 6-14 3z" fill="var(--ok)"/></g>
        </g>
      </g>
      <path d="M4 136q22-8 44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0V170H4z" fill="var(--water)" opacity=".92"/>
      <g id="floaters"></g>
    </svg>
    <div class="speech" id="speech">泡好了，來寫題吧。</div>
    <div class="plus" id="plus">+1</div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <section class="card intro" id="intro">
    <h1>名詞子句 × 形容詞子句 × 副詞子句</h1>
    <p>每回從題庫隨機抽 100 題。答對一題得 1 分，卡皮巴拉的溫泉裡就多一顆柚子。每題作答後，詳解會出現在下方。</p>
    <div class="small">題目範圍</div>
    <div class="chips" id="chips"></div>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="startBtn">開始作答</button></div>
    <div class="best" id="best"></div>
  </section>

  <section class="card hidden" id="quiz">
    <div class="tag" id="tag"></div>
    <div id="passage"></div>
    <p class="stem" id="stem"></p>
    <div class="opts" id="opts"></div>
    <div class="exp hidden" id="exp"></div>
    <div class="row">
      <button class="btn ghost" id="quitBtn">結束這回</button>
      <button class="btn hidden" id="nextBtn">下一題</button>
    </div>
  </section>

  <section class="card hidden" id="result">
    <div class="small">本回得分</div>
    <div class="big" id="final"></div>
    <p id="comment" style="margin:10px 0 0"></p>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" id="againBtn">再抽一回</button>
      <button class="btn ghost" id="wrongBtn">只練這回錯的題</button>
      <button class="btn ghost" id="homeBtn">換範圍</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</div>

<script>
const BANK = [{"n":1,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"______ she finished the marathon at the age of seventy surprised everyone.","o":["What","If","Which","That"],"a":3,"j":"動詞 surprised 前面整段是主詞，所以空格引導名詞子句。子句 she finished the marathon 主詞、動詞、受詞都有，是完整的 → 用 That。名詞子句放在句首當主詞時，that 不可省。","x":"What 要用在子句缺主詞或受詞時；Which 不能引導名詞子句表「那件事」；If 不能放在句首當主詞。"},{"n":2,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"The problem is ______ we don't have enough volunteers for the event.","o":["what","that","which","whom"],"a":1,"j":"be 動詞後面的名詞子句當主詞補語。we don't have enough volunteers 是完整句 → that。","x":"what 本身需擔任名詞成分，但此處沒有空位；which、whom 若引導間接問句，須有相應的名詞成分可代替；本題沒有這種空位。"},{"n":3,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"Most scientists agree ______ climate change is speeding up.","o":["that","what","which","whom"],"a":0,"j":"agree 後接受詞子句。climate change is speeding up 完整 → that。","x":"what 用於缺主詞或受詞的子句；which、whom 在此完整子句中沒有可擔任的名詞成分。"},{"n":4,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"______ the new library will open next month has been confirmed by the city.","o":["What","Which","That","It"],"a":2,"j":"句子真正的動詞是 has been confirmed，前面整段是主詞。子句完整 → That。","x":"It 是虛主詞，用法是 It has been confirmed that…，不會直接接子句再接動詞；What、Which 不適用於完整子句。"},{"n":5,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"My guess is ______ the package was sent to the wrong address.","o":["which","that","what","whom"],"a":1,"j":"補語位置，子句 the package was sent to… 是完整的被動句 → that。","x":"what 用於缺名詞的子句；which、whom 在此沒有可代替的名詞成分。"},{"n":6,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"The coach told us ______ the game had been put off because of the typhoon.","o":["that","which","what","whom"],"a":0,"j":"tell＋人＋that 子句，that 子句是直接受詞，子句完整。","x":"what 會讓子句缺受詞；which、whom 前面沒有可以修飾的名詞（us 是間接受詞，不是先行詞）。"},{"n":7,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"下列哪一句中的 that 可以省略？","o":["That the plan failed is a pity.","The book that is on the desk is mine.","I believe that she will win the contest.","She bought a phone that has a large screen."],"a":2,"j":"當動詞受詞的 that 子句（I believe that…），that 可以省略。","x":"A 的句首主詞子句不能省 that；B、D 的 that 都是限定關係子句的主詞，不能直接省略。"},{"n":8,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"請選出表示「並列補充」的連接方式。 My mom said that dinner was ready ______ we should wash our hands first.","o":["but that","which","that and","and that"],"a":3,"j":"兩個受詞子句用 and that 並列，將兩項相連的指示都放在 said 的內容中。第二個 that 保留可使結構清楚，但並非所有並列受詞子句都強制保留。","x":"but that 表轉折，不合此處順接的指示；that and 語序錯；which 不能連接這兩個完整內容。"},{"n":9,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"The reason for the delay is ______ the pilot suddenly felt sick.","o":["whether","that","why","what"],"a":1,"j":"The reason is that…。reason 本身已經表示「原因」，補語用 that 引導完整子句即可。","x":"whether 表是否，不合此處直接說明原因的語意；why 會變成「延誤的原因是飛行員不舒服的原因」，不合題意；what 在後面的完整子句中沒有可擔任的名詞成分。"},{"n":10,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"The trouble is ______ nobody remembers the Wi-Fi password.","o":["which","what","that","whom"],"a":2,"j":"補語位置，nobody remembers the password 完整 → that。","x":"what 用於缺名詞的子句；which、whom 在此沒有可代替的名詞成分。"},{"n":11,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"______ the earth goes around the sun is a fact every child learns.","o":["That","What","Which","Whether"],"a":0,"j":"敘述一個確定的事實，子句 the earth goes around the sun 完整 → That。","x":"Whether 表「是否」，與「每個孩子都學到的事實」語意矛盾；What、Which 不引導完整子句。"},{"n":12,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"Everyone knows ______ practice makes perfect.","o":["what","which","whom","that"],"a":3,"j":"know 的受詞，子句完整 → that。","x":"what 在此沒有可擔任的名詞成分；which、whom 在此沒有可代替的名詞成分。"},{"n":13,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"I'm afraid ______ the shop has already closed.","o":["what","that","which","if"],"a":1,"j":"be afraid that…（恐怕…），後接完整子句。","x":"if 表「是否」，與「恐怕已經關了」語意不合；what、which 不引導完整子句。"},{"n":14,"p":"noun","s":"that 子句當主詞、受詞、補語","q":"She was worried ______ her son might get lost in the crowd.","o":["which","what","that","about"],"a":2,"j":"be worried that＋完整子句。","x":"about 不能直接接本題的 that 型陳述內容，但可接 whether／what 等名詞子句；what、which 在此沒有名詞成分可擔任。"},{"n":15,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"______ is surprising that the shy boy won the speech contest.","o":["That","What","This","It"],"a":3,"j":"真正的主詞是 that 子句，因為太長所以移到句尾，用虛主詞 It 佔住主詞位置。","x":"虛主詞只能用 It；That、This 不能當虛主詞；What 會讓句子有兩個主詞。"},{"n":16,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"It is clear ______ we need a better plan.","o":["that","what","which","if"],"a":0,"j":"It is＋adj.＋that 子句，真主詞是 that 子句，子句完整。","x":"if 表「是否」，與 clear（很清楚）矛盾；what、which 不引導完整子句。"},{"n":17,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"I find ______ hard to believe that he quit his job.","o":["this","that","it","what"],"a":2,"j":"虛受詞句型：find it＋adj.＋that 子句。it 代替後面真正的受詞 that 子句。","x":"虛受詞只能用 it；this、that 不能當虛受詞；what 不合文法。"},{"n":18,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"We think it important ______ students get enough sleep.","o":["that","what","which","whom"],"a":0,"j":"think it＋adj.＋that 子句（虛受詞句型），子句完整。","x":"what 在此沒有可擔任的名詞成分；which、whom 在此沒有可代替的名詞成分。"},{"n":19,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"It has been reported ______ two climbers are missing on the mountain.","o":["what","that","which","where"],"a":1,"j":"It is reported/said that…，真主詞是 that 子句。","x":"where 要用在缺地點的子句；what、which 不引導完整子句。"},{"n":20,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"下列哪一句正確？","o":["That is strange that he didn't call.","This is strange that he didn't call.","It is strange what he didn't call.","It is strange that he didn't call."],"a":3,"j":"虛主詞只能用 It，真主詞為完整的 that 子句。","x":"That、This 不能當虛主詞；what 引導的子句要缺名詞，he didn't call 並不缺。"},{"n":21,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"She made ______ clear that she would not change her mind.","o":["this","that","it","what"],"a":2,"j":"make it clear that…，it 是虛受詞，真受詞是 that 子句。","x":"虛受詞固定用 it；this、that、what 都不能放在這個位置。"},{"n":22,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"It doesn't matter ______ you are rich or poor.","o":["whether","that","what","which"],"a":0,"j":"後面有 or，表「是…還是…」→ whether。It doesn't matter whether…（不論是否…都沒關係）。","x":"此處問的是「富有或貧窮都不影響結果」，所以用 whether；that 只陳述內容，不表這種兩種可能皆可的意思；what、which 在此沒有名詞成分可代替。"},{"n":23,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"It seems ______ the rain will never stop.","o":["whether","what","which","that"],"a":3,"j":"It seems that…（看起來似乎…），子句完整。","x":"whether 表「是否」，seem 不接；what、which 不合文法。"},{"n":24,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"I consider ______ important that every student feels safe in class.","o":["that","it","this","what"],"a":1,"j":"consider it＋形容詞＋that 子句；it 是虛受詞，後面的 that 子句說明重要的事情。","x":"虛受詞固定用 it。"},{"n":25,"p":"noun","s":"虛主詞 it／虛受詞 it","q":"It is no exaggeration to say ______ smartphones have changed our lives.","o":["what","whom","which","that"],"a":3,"j":"say 的受詞是完整子句 → that。It is no exaggeration to say that…（說…一點也不誇張）。","x":"what、which、whom 在此完整子句中都沒有可擔任的名詞成分。"},{"n":26,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Can you tell me ______?","o":["where is the station","where the station is","the station is where","where does the station"],"a":1,"j":"疑問句放進句子裡變成名詞子句後，要還原成「疑問詞＋S＋V」的直述語序。","x":"where is the station 保留了疑問句倒裝；the station is where 疑問詞位置錯；where does the station 缺動詞。"},{"n":27,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"I wonder ______.","o":["why she is always late","why is she always late","why does she always late","she is always late why"],"a":0,"j":"why＋S＋V，直述語序。","x":"why is she… 是倒裝語序；does 與 late（形容詞）搭配不合文法；疑問詞不放句尾。"},{"n":28,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Nobody knows ______ the old man came from.","o":["what","which","where","that"],"a":2,"j":"come from 後面缺「地點」→ where。","x":"where 問人的來處；what 問事物、which 問指定範圍，均不合本題一般詢問出身地的語境；that 不能補足 from 後的疑問內容。"},{"n":29,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Do you know ______ the meeting will start?","o":["whom","what","when","which"],"a":2,"j":"the meeting will start 完整，缺的是時間 → when。","x":"what、whom 不能充當此處的時間副詞；which 沒有選擇範圍，也無名詞成分可代替。"},{"n":30,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Where are you? + I don't know that. → I don't know ______.","o":["where you are","where are you","that where you are","you are where"],"a":0,"j":"把疑問句當受詞放進去，語序改為 S＋V。","x":"where are you 仍是疑問語序；that 與 where 不可並用；疑問詞不放句尾。"},{"n":31,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Please tell me ______ you were late again.","o":["what","why","which","whom"],"a":1,"j":"you were late again 完整，要問「原因」→ why。","x":"what、which、whom 都不能充當此處的原因副詞。"},{"n":32,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"I have no idea ______.","o":["what does this word mean","this word means what","what means this word","what this word means"],"a":3,"j":"還原成直述語序：what＋S＋V。原句的助動詞 does 要拿掉，動詞改回 means。","x":"保留 does 是疑問語序；what means this word 主詞位置錯；疑問詞不放句尾。"},{"n":33,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"The teacher asked us ______ we had finished the homework.","o":["that","what","whether","which"],"a":2,"j":"原句 Have you finished…? 是 yes/no 問句，改成間接問句要補 whether 或 if。","x":"that 不表「是否」；what 會缺名詞；which 要接範圍。"},{"n":34,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"______ the thief got into the house is still a mystery.","o":["What","Which","Whom","How"],"a":3,"j":"the thief got into the house 完整，問的是「方式」→ How。","x":"What、Which、Whom 在後面的完整子句中沒有可擔任的名詞成分；How 表示進屋的方式。"},{"n":35,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Could you tell me ______ this jacket costs?","o":["how many","how much","what much","that"],"a":1,"j":"問價錢用 how much；this jacket costs (how much)。","x":"how many 接可數名詞；what much 不存在；that 不表疑問。"},{"n":36,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"I can't remember ______ I put my keys.","o":["where","what","which","whom"],"a":0,"j":"put my keys 後面缺「放在哪裡」→ where。","x":"put 的受詞 my keys 已有；what、which、whom 不能補足此處所問的放置地點。"},{"n":37,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"______ will win the election is hard to predict.","o":["That","Whom","What","Who"],"a":3,"j":"子句缺主詞，且指人 → 主格 Who。","x":"Whom 是受格；What 不指人；That 引導完整子句。"},{"n":38,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"Do you know ______ umbrella this is? I'd like to return it to its owner.","o":["who","whom","whose","what"],"a":2,"j":"空格後接名詞 umbrella，且後句提到 owner（主人），問「誰的」→ whose＋N。","x":"who、whom 後面不直接接名詞；what umbrella 表「什麼傘」，和「還給主人」的語意不合。"},{"n":39,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"The question is ______ we should do next.","o":["what","that","which","whether"],"a":0,"j":"do 後面缺受詞 → what。","x":"whether 用於完整子句；that 用於完整子句；which 要接範圍。"},{"n":40,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"She asked me ______ I usually went to school.","o":["what","how","that","which"],"a":1,"j":"went to school 完整，問「方式」→ how。","x":"what 用於缺名詞；that、which 不合。"},{"n":41,"p":"noun","s":"間接問句（疑問句還原成直述語序）","q":"下列哪一句正確？","o":["I don't know what time is it.","I don't know it is what time.","I don't know what time it is.","I don't know what is time it."],"a":2,"j":"what time＋S＋V，直述語序。","x":"A 保留疑問語序；B、D 語序錯誤。"},{"n":42,"p":"noun","s":"if／whether","q":"Is she a princess? + I don't know it. → I don't know ______.","o":["that she is a princess","what she is a princess","is she a princess","if she is a princess"],"a":3,"j":"yes/no 問句改成名詞子句時，要補上 if 或 whether（是否）。","x":"that 會變成「我不知道她是公主這件事」，意思不同；is she… 保留疑問語序；what 不能接完整子句。"},{"n":43,"p":"noun","s":"if／whether","q":"______ he will accept the job offer is still unknown.","o":["Whom","Whether","If","What"],"a":1,"j":"表「是否」，且子句放句首當主詞 → 只能用 Whether。","x":"If 不用來引導這種句首主詞子句；What、Whom 在此完整子句中沒有可擔任的名詞成分。"},{"n":44,"p":"noun","s":"if／whether","q":"I'm not sure ______ the store is open on Sundays.","o":["if","what","which","how"],"a":0,"j":"表「是否」→ if（也可用 whether）。","x":"what 用於缺名詞；which 要接範圍；how 表方式，語意不合。"},{"n":45,"p":"noun","s":"if／whether","q":"The question of ______ we should raise prices needs discussion.","o":["if","that","whether","what"],"a":2,"j":"介系詞 of 後面引導「是否」，只能用 whether。","x":"if 不放在介系詞後；that 子句不放介系詞後；what 用於缺名詞。"},{"n":46,"p":"noun","s":"if／whether","q":"Whether you like it ______ not, you have to finish the report.","o":["but","and","nor","or"],"a":3,"j":"whether…or not 固定搭配。","x":"and、nor、but 都不能與 whether 搭配表「是否」。"},{"n":47,"p":"noun","s":"if／whether","q":"Whether he is single ______ to me.","o":["doesn't matter","don't matter","isn't matter","not matter"],"a":0,"j":"名詞子句當主詞視為單數；matter 是一般動詞（要緊），否定用 doesn't。","x":"don't 配複數主詞；matter 是動詞，不能用 isn't；not matter 缺助動詞。"},{"n":48,"p":"noun","s":"if／whether","q":"Everything depends on ______ we can get enough funding.","o":["if","whether","that","what"],"a":1,"j":"介系詞 on 後面表「是否」→ whether。","x":"if 不放介系詞後；that 子句不放介系詞後；what 不接完整子句。"},{"n":49,"p":"noun","s":"if／whether","q":"I asked my sister ______ she could lend me her bike.","o":["that","what","which","if"],"a":3,"j":"原句 Can you lend me your bike? 是 yes/no 問句 → if／whether。","x":"that 不表「是否」；what、which 不接完整的 yes/no 問句。"},{"n":50,"p":"noun","s":"if／whether","q":"______ or not the plan works, we will learn something from it.","o":["If","That","Whether","What"],"a":2,"j":"whether or not 可以連用；此處 whether 子句表「不管是否」。","x":"If 不能和 or not 緊接著放在句首；That、What 不表「是否」。"},{"n":51,"p":"noun","s":"if／whether","q":"What we need to decide is ______ we should leave now or wait.","o":["whether","that","what","which"],"a":0,"j":"後面有 A or B 兩個選擇 → whether。補語位置的「是否」用 whether 最穩當。","x":"that 直接陳述內容，不表本題「現在走或等待」的待決選擇；what、which 在完整子句中沒有可代替的名詞成分。"},{"n":52,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"The fact ______ he lied to us made everyone upset.","o":["which","that","what","whom"],"a":1,"j":"he lied to us 完整，說明 fact 的內容 → 同位語子句，用 that。","x":"which 是關係代名詞，後面子句要缺名詞；what 前面不能有先行詞；whom 指人。"},{"n":53,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"There is a rumor ______ the school will build a new gym.","o":["that","which","what","whose"],"a":0,"j":"rumor 的內容＝the school will build a new gym（完整）→ 同位語 that。","x":"which 不能引導同位語子句；what 不放先行詞後；whose 要接名詞。"},{"n":54,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"The idea ______ robots will replace teachers worries many people.","o":["which","whom","what","that"],"a":3,"j":"idea 的內容由完整子句說明 → 同位語 that。","x":"which、whom 引導形容詞子句（子句會缺名詞）；what 不放先行詞後。"},{"n":55,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"She couldn't accept the news ______ her dog had died.","o":["which","that","what","whose"],"a":1,"j":"news＋that＋完整子句（同位語，說明消息內容）。","x":"which 在此沒有可代替的名詞成分；whose 不能修飾代名詞 he；what 不引導此處說明消息內容的完整子句。"},{"n":56,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"Nobody believed his story ______ he had seen a UFO.","o":["which","what","that","whose"],"a":2,"j":"story 的內容＝he had seen a UFO → 同位語 that。","x":"which、what 在此完整子句中沒有可擔任的名詞成分；whose 不能修飾代名詞 he。"},{"n":57,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"We have to face the fact ______ natural resources are running out.","o":["that","which","what","whose"],"a":0,"j":"fact 後接完整子句說明內容 → 同位語 that。正式寫作中這個 that 保留。","x":"what 不放先行詞後；which 引導形容詞子句；whose 要接名詞。"},{"n":58,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"The notion ______ geniuses are born, not made, is a myth.","o":["which","that","what","who"],"a":1,"j":"notion（觀念）是空泛名詞，後接完整子句 → 同位語 that。","x":"which、who 引導形容詞子句；what 不放先行詞後。"},{"n":59,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"下列哪一個名詞「最不適合」接同位語 that 子句？","o":["fact","belief","table","rumor"],"a":2,"j":"同位語子句說明一個「抽象、需要補充內容」的名詞，例如 fact、belief、rumor、idea、news、hope。","x":"table 是具體名詞，沒有「內容」可以說明。"},{"n":60,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"The hope ______ she would recover kept the family going.","o":["which","what","whom","that"],"a":3,"j":"hope 的內容＝she would recover（完整）→ 同位語 that。","x":"which、whom 引導形容詞子句；what 不放先行詞後。"},{"n":61,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"There is no doubt ______ she is the best player on the team.","o":["that","which","whose","what"],"a":0,"j":"There is no doubt that…（毫無疑問）。肯定語意，用 that。","x":"此處需要直接陳述確定內容的 that；which、what 沒有名詞成分可代替，whose 不能修飾代名詞 she。"},{"n":62,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"He made a promise ______ he would never be late again.","o":["what","which","that","whom"],"a":2,"j":"promise 的內容＝完整子句 → 同位語 that。","x":"which、whom 引導形容詞子句；what 不放先行詞後。"},{"n":63,"p":"noun","s":"同位語子句（空泛名詞＋that）","q":"The theory ______ all humans came from Africa is widely accepted.","o":["which","that","what","whose"],"a":1,"j":"theory＋that＋完整子句（同位語）。","x":"which 引導形容詞子句；what 不放先行詞後；whose 要接名詞。"},{"n":64,"p":"noun","s":"what 與 that 的分辨","q":"______ he said at the meeting made the boss angry.","o":["That","Whether","Which","What"],"a":3,"j":"said 後面缺受詞，前面也沒有先行詞 → What（ 149,"p":"adj","s":"what、those who、複合關係代名詞","q":"______ you do, don't give up.","o":["Whoever","Whenever","Whatever","Whomever"],"a":2,"j":"do 缺受詞（事情）→ whatever（＝no matter what）。","x":"Whoever、Whomever 指人；Whenever 表時間，do 的受詞就沒有著落。"},{"n":150,"p":"adj","s":"what、those who、複合關係代名詞","q":"There are three colors. You can choose ______ you like.","o":["whichever","whoever","whomever","however"],"a":0,"j":"在給定的範圍（三種顏色）中任選 → whichever。","x":"whoever、whomever 指人；however 表方式。"},{"n":151,"p":"adj","s":"what、those who、複合關係代名詞","q":"______ wants to join the club should sign up by Friday.","o":["Whomever","Whoever","Those","Anyone"],"a":1,"j":"子句缺主詞，整個子句當主句的主詞 → Whoever。","x":"Whomever 是受格；Those、Anyone 後面要加 who 才能接動詞。"},{"n":152,"p":"adj","s":"what、those who、複合關係代名詞","q":"Those ______ broke the rules were punished.","o":["which","whose","whom","who"],"a":3,"j":"those who＋V。","x":"which 指物；whom 是受格；whose 要接名詞。"},{"n":153,"p":"adj","s":"what、those who、複合關係代名詞","q":"「凡是遲到的人都要罰站。」","o":["Those who are late must stand.","Those who is late must stand.","Those which are late must stand.","Who are late must stand."],"a":0,"j":"those 是複數，who 子句的動詞跟著用 are。","x":"B 主詞動詞不一致；C 的 which 不指人；D 缺先行詞 those。"},{"n":154,"p":"adj","s":"what、those who、複合關係代名詞","q":"The police will give a ticket to ______ drives through a red light.","o":["anyone","whomever","who","whoever"],"a":3,"j":"雖然在介系詞 to 後面，但要看子句內部：drives 缺主詞 → 主格 whoever。","x":"whomever 是受格；who、anyone 後面不能直接接動詞當「任何…的人」。"},{"n":155,"p":"adj","s":"what、those who、複合關係代名詞","q":"I'll give this book to ______ needs it most.","o":["whomever","whatever","whoever","who"],"a":2,"j":"子句 ___ needs it most 缺主詞 → whoever。介系詞後面不代表一定用受格。","x":"whomever 是受格；whatever 指事物；who 單獨不表「任何人」。"},{"n":156,"p":"adj","s":"what、those who、複合關係代名詞","q":"This is exactly ______ I have been looking for.","o":["that","what","which","whom"],"a":1,"j":"looking for 缺受詞，前面沒有先行詞（exactly 是副詞）→ what。","x":"that 不引導這裡的缺空結構；which 缺少選擇範圍；whom 指人，不合語意。"},{"n":157,"p":"adj","s":"what、those who、複合關係代名詞","q":"______ I said was true.","o":["That","What","Which","Who"],"a":1,"j":"said 缺受詞，沒有先行詞 → What。","x":"That 引導完整子句；Which 需要可辨認的選擇範圍，本題未提供；Who 指人。"},{"n":158,"p":"adj","s":"what、those who、複合關係代名詞","q":"He is not ______ he used to be.","o":["what","which","that","where"],"a":0,"j":"what he used to be（從前的他），what 在子句中當補語。","x":"that 不能引導這個缺補語的內容；which 在此沒有選擇範圍；where 表地點。who he used to be 也可成立，但本題未列 who。"},{"n":159,"p":"adj","s":"數量詞＋of whom／of which","q":"The coach picked five players, all of ______ were under eighteen.","o":["them","who","which","whom"],"a":3,"j":"逗號連接兩個子句，中間沒有連接詞 → 用關係代名詞；指人 → all of whom。","x":"them 是代名詞，用了它就需要 and；which 指物；介系詞 of 後不用 who。"},{"n":160,"p":"adj","s":"數量詞＋of whom／of which","q":"I bought five books, two of ______ are for my sister.","o":["them","whom","which","that"],"a":2,"j":"沒有連接詞，指物 → two of which。","x":"them 需要搭配 and；whom 指人；that 不放介系詞後。"},{"n":161,"p":"adj","s":"數量詞＋of whom／of which","q":"I bought five books, and two of ______ are for my sister.","o":["that","whom","which","them"],"a":3,"j":"已經有連接詞 and → 用代名詞 them。","x":"and 後已是第二個主要子句，應用 them 作介系詞 of 的受詞；that、whom、which 都不能在此構成完整的第二個主要子句。"},{"n":162,"p":"adj","s":"數量詞＋of whom／of which","q":"Mrs. Lin has three daughters, one of ______ just got married.","o":["them","who","whom","which"],"a":2,"j":"沒有連接詞，人 → one of whom。","x":"them 需要 and；介系詞後不用 who；which 指物。"},{"n":163,"p":"adj","s":"數量詞＋of whom／of which","q":"Humans have destroyed many animal habitats, ______ is the bees' habitat.","o":["one of which","one of whom","and one of which","one of them"],"a":0,"j":"habitats 是物，沒有連接詞 → one of which。","x":"whom 指人；and＋which 連接詞重複；one of them 需要 and。"},{"n":164,"p":"adj","s":"數量詞＋of whom／of which","q":"There were forty students in the class, most of ______ passed the test.","o":["them","whom","which","who"],"a":1,"j":"沒有連接詞，人 → most of whom。","x":"them 需要 and；which 指物；介系詞後不用 who。"},{"n":165,"p":"adj","s":"數量詞＋of whom／of which","q":"He has two cars, neither of ______ works well.","o":["them","which","whom","that"],"a":1,"j":"沒有連接詞，物 → neither of which。","x":"them 需要 and；whom 指人；that 不放介系詞後。"},{"n":166,"p":"adj","s":"數量詞＋of whom／of which","q":"Many celebrities came to the party, two of ______ were famous actors.","o":["them","those","which","whom"],"a":3,"j":"沒有連接詞，人 → two of whom。","x":"them、those 需要連接詞；which 指物。"},{"n":167,"p":"adj","s":"數量詞＋of whom／of which","q":"下列哪一句正確？","o":["I have two brothers, both of them are doctors.","I have two brothers, both of which are doctors.","I have two brothers, both of whom are doctors.","I have two brothers, and both of whom are doctors."],"a":2,"j":"沒有連接詞，人 → both of whom。","x":"A 兩句只用逗號相連；B 的 which 不指人；D 連接詞 and 和關代重複。"},{"n":168,"p":"adj","s":"關代省略與形容詞子句減化","q":"The girl ______ he likes is from Kaohsiung. 下列哪一個「不能」填入空格？","o":["whom","that","X（不填）","whose"],"a":3,"j":"受格關代可以用 whom、that，也可以省略。","x":"whose 後面一定要接名詞，這裡 he likes 前面沒有名詞可接。"},{"n":169,"p":"adj","s":"關代省略與形容詞子句減化","q":"The meal ______ in that restaurant tastes great.","o":["served","serving","is served","serves"],"a":0,"j":"原句 which is served → 刪掉關代與 be 動詞 → served（餐點「被」供應，被動）。","x":"serving 是主動；is served、serves 會多出未以關係詞或連接詞連接的限定動詞。"},{"n":170,"p":"adj","s":"關代省略與形容詞子句減化","q":"Anyone ______ the rules will be fined.","o":["breaking","broken","breaks","has broken"],"a":0,"j":"原句 who breaks the rules → breaking the rules（主動）。","x":"broken 為過去分詞，不合 anyone 主動違規的關係；breaks、has broken 都是限定動詞，前面需要 who 等關係詞。"},{"n":171,"p":"adj","s":"關代省略與形容詞子句減化","q":"The Greeks bake a special type of bread ______ a lucky coin.","o":["is containing","contained","contains","containing"],"a":3,"j":"原句 which contains → containing（麵包主動含有硬幣）。","x":"contained 是被動；contains、is containing 會多出未適當連接的限定動詞。"},{"n":172,"p":"adj","s":"關代省略與形容詞子句減化","q":"Phuket is a beautiful island ______ with natural resources.","o":["which blessed","blesses","blessed","blessing"],"a":2,"j":"原句 which is blessed with → blessed with（被賦予）。","x":"which blessed 變成主動；blesses 多出動詞；blessing 是主動。"},{"n":173,"p":"adj","s":"關代省略與形容詞子句減化","q":"People ______ in a city may not know the joys of country life.","o":["live","living","lived","to live"],"a":1,"j":"原句 who live → living（主動）。","x":"live 會多出未適當連接的限定動詞；lived 是被動或過去式；to live 不表狀態。"},{"n":174,"p":"adj","s":"關代省略與形容詞子句減化","q":"The question ______ in class was hard to answer.","o":["asked","asking","was asked","asks"],"a":0,"j":"原句 which was asked → asked（問題被問）。","x":"asking 是主動；was asked、asks 會多出未適當連接的限定動詞。"},{"n":175,"p":"adj","s":"關代省略與形容詞子句減化","q":"The sunlight ______ through the window wakes me up every morning.","o":["comes","came","coming","to come"],"a":2,"j":"原句 which comes → coming（主動）。","x":"came、comes 會多出未適當連接的限定動詞；to come 表未來。"},{"n":176,"p":"adj","s":"關代省略與形容詞子句減化","q":"The damage ______ by the typhoon was huge.","o":["causing","was caused","causes","caused"],"a":3,"j":"原句 which was caused → caused；by 是被動的線索。","x":"causing 是主動；causes、was caused 會多出未適當連接的限定動詞。"},{"n":177,"p":"adj","s":"關代省略與形容詞子句減化","q":"The man ______ in a blue uniform looks like my high school classmate.","o":["dress","dressed","dresses","was dressed"],"a":1,"j":"dressed in a blue uniform 描述男子穿著藍色制服的狀態，可還原為 who is dressed in a blue uniform。","x":"dress、dresses、was dressed 都不能在沒有關係詞的情況下直接接在 the man 後，再接主句動詞 looks。"},{"n":178,"p":"adj","s":"關代省略與形容詞子句減化","q":"A stone that rolls is called a ______ stone.","o":["rolled","to roll","roll","rolling"],"a":3,"j":"rolling 表示會滾動的性質，在本題放在名詞 stone 前修飾它。","x":"rolled 是被動；roll 是動詞；to roll 不放名詞前。"},{"n":179,"p":"adj","s":"關代省略與形容詞子句減化","q":"The ______ mother called the police again.","o":["worried","worry","worries","to worry"],"a":0,"j":"worried 表示感到擔心，在本題放在 mother 前描述其狀態。","x":"worry、worries 是動詞或名詞；to worry 不放名詞前。"},{"n":180,"p":"adj","s":"關代省略與形容詞子句減化","q":"The old man ______ money gave up treatment.","o":["lacks","lacking","lacked","to lack"],"a":1,"j":"原句 who lacked money → lacking money（主動）。","x":"lacks、lacked 會多出未適當連接的限定動詞；to lack 不表狀態。"},{"n":181,"p":"mix","s":"關代省略與形容詞子句減化","q":"I don't like the rumor ______ you told me.","o":["what","whose","that","where"],"a":2,"j":"told me ___ 缺直接受詞 → 形容詞子句，修飾 rumor，用 that（或 which）。","x":"what 不接在先行詞後；whose 要接名詞；where 子句要完整。"},{"n":182,"p":"mix","s":"關代省略與形容詞子句減化","q":"There is a rumor ______ the mayor will resign.","o":["which","that","what","whose"],"a":1,"j":"the mayor will resign 完整，說明 rumor 的內容 → 同位語子句，只能用 that。","x":"which 只能引導形容詞子句（子句會缺名詞）；what 不接在先行詞後；whose 要接名詞。"},{"n":183,"p":"mix","s":"關代省略與形容詞子句減化","q":"The fact ______ she mentioned in her speech surprised us.","o":["what","where","whose","that"],"a":3,"j":"mentioned ___ 缺受詞 → 形容詞子句，用 that（或 which）。","x":"what 不接在先行詞後；whose 要接名詞；where 子句要完整。"},{"n":184,"p":"mix","s":"關代省略與形容詞子句減化","q":"The fact ______ she won the award surprised us.","o":["that","what","which","where"],"a":0,"j":"she won the award 完整 → 同位語子句，只能用 that。","x":"which 用在缺名詞的子句；what 不接在先行詞後；where 表地點。"},{"n":185,"p":"mix","s":"關代省略與形容詞子句減化","q":"Our planet is under serious threat, ______ has made many species endangered.","o":["that","what","which","whatever"],"a":2,"j":"指前面整件事（地球受威脅）→ , which。","x":"that 不引導本題的非限定關係子句；what、whatever 不接在先行詞後。"},{"n":186,"p":"mix","s":"關代省略與形容詞子句減化","q":"He finally told us the truth ______ he had tried to hide for years.","o":["in which","what","where","which"],"a":3,"j":"hide ___ 缺受詞 → 形容詞子句，用 which（或 that）。","x":"in which、where 後面子句要完整；what 不接在先行詞後。"},{"n":187,"p":"mix","s":"關代省略與形容詞子句減化","q":"Few people believed the idea ______ smartphones would become so important.","o":["which","what","that","where"],"a":2,"j":"smartphones would become so important 完整，說明 idea 的內容 → 同位語 that。","x":"which 用在缺名詞的子句；what 不接在先行詞後；where 表地點。"},{"n":188,"p":"mix","s":"關代省略與形容詞子句減化","q":"The bad news is ______ he broke up with his girlfriend.","o":["that","what","which","whom"],"a":0,"j":"補語子句完整 → that。","x":"which、whom 在此沒有可代替的名詞成分；what 用在缺名詞的子句。"},{"n":189,"p":"mix","s":"關代省略與形容詞子句減化","q":"The bad news is that ______ has been a sharp drop in the bee population.","o":["it","there","X","what"],"a":1,"j":"there has been＋N（出現了…）。that 子句裡需要 there 當主詞位置。","x":"it has been a sharp drop 語意不通；不填則子句缺主詞；what 不合文法。"},{"n":190,"p":"mix","s":"關代省略與形容詞子句減化","q":"One reason is ______ genetic diversity is closely related to biodiversity.","o":["that","whether","why","what"],"a":0,"j":"One reason is that＋完整子句。","x":"whether 表是否，不合直接陳述原因；why 會變成另一個原因，不合題意；what 在後面的完整子句中沒有名詞成分可代替。"},{"n":191,"p":"mix","s":"關代省略與形容詞子句減化","q":"It is apparent ______ biodiversity is of great importance.","o":["whom","that","whose","which"],"a":1,"j":"虛主詞 It，真主詞是 that 子句。","x":"whom、which 在完整子句中沒有名詞成分可代替；whose biodiversity 會變成詢問所屬，不合直接陳述生物多樣性重要的意思。"},{"n":192,"p":"mix","s":"關代省略與形容詞子句減化","q":"She came home only to find ______ the door was open and ______ her laptop was gone.","o":["that…what","which…which","what…what","that…that"],"a":3,"j":"find 後接兩項完整內容，用 that… and that… 清楚並列。第二個 that 有助於標明子句範圍，但不能概括為任何情況都不可省。","x":"which 需要先行詞；what 用在缺名詞的子句。"},{"n":193,"p":"mix","s":"關代省略與形容詞子句減化","q":"Robots today can do ______ people once thought only humans could do.","o":["which","that","what","whom"],"a":2,"j":"do 的受詞位置缺名詞，前面沒有先行詞 → what（人們曾以為只有人類能做的事）。","x":"which、that、whom 都需要先行詞。"},{"n":194,"p":"mix","s":"關代省略與形容詞子句減化","q":"______ I need is someone ______ understands me.","o":["What…who","That…what","What…what","That…who"],"a":0,"j":"第一空：need 缺受詞、沒有先行詞 → What；第二空：修飾 someone、子句缺主詞 → who。","x":"第一空用 That 會讓 need 缺受詞；第二空用 what 不接在先行詞後。"},{"n":195,"p":"mix","s":"關代省略與形容詞子句減化","q":"下列哪一個 that 引導的是「同位語子句」？","o":["The book that I borrowed is overdue.","The car that she bought is red.","The man that called you is my boss.","The news that he passed the exam excited us."],"a":3,"j":"D 的 that 子句完整，說明 news 的內容 → 同位語。","x":"A、B 的子句缺受詞，C 的子句缺主詞，都是形容詞子句。"},{"n":196,"p":"mix","s":"關代省略與形容詞子句減化","q":"下列哪一個 that 引導的是「形容詞子句」？","o":["I know that he is honest.","It's clear that we need help.","The idea that he suggested is fun.","The idea that we can fly is fun."],"a":2,"j":"C 的 suggested 缺受詞 → 形容詞子句。","x":"A 是受詞子句；B 是真主詞子句；D 子句完整，是同位語子句。"},{"n":197,"p":"mix","s":"關代省略與形容詞子句減化","q":"Do you remember the day ______ we spent together at the beach?","o":["when","which","where","what"],"a":1,"j":"spent ___ 缺受詞（花掉那一天）→ which。看到 the day 不一定用 when。","x":"when、where 後面子句要完整；what 不接在先行詞後。"},{"n":198,"p":"mix","s":"關代省略與形容詞子句減化","q":"Do you remember the day ______ we went to the beach together?","o":["when","what","which","where"],"a":0,"j":"we went to the beach together 完整，缺時間 → when。","x":"which 在此沒有可代替的名詞成分；what 不接在先行詞後；where 表地點。"},{"n":199,"p":"mix","s":"關代省略與形容詞子句減化","q":"This is the place ______ I told you about.","o":["where","when","what","which"],"a":3,"j":"about ___ 缺受詞 → which。看到 the place 不一定用 where。","x":"where 後面子句要完整；what 不接在先行詞後；when 表時間。"},{"n":200,"p":"mix","s":"關代省略與形容詞子句減化","q":"This is the place ______ I lost my wallet.","o":["which","what","where","whom"],"a":2,"j":"I lost my wallet 完整，缺地點 → where。","x":"which、whom 在 I lost my wallet 中沒有可代替的名詞成分；what 不用來修飾先行詞 the place。"},{"n":201,"p":"mix","s":"關代省略與形容詞子句減化","q":"I don't know the city ______ he lives in.","o":["where","which","what","how"],"a":1,"j":"in 留在句尾，缺 in 的受詞 → which。","x":"where 會和 in 重複；what 不接在先行詞後；how 不接先行詞。"},{"n":202,"p":"mix","s":"關代省略與形容詞子句減化","q":"______ surprised me most was his honesty.","o":["That","What","Which","It"],"a":1,"j":"子句缺主詞、沒有先行詞 → What。","x":"That 引導完整子句；Which 需要可辨認的選擇範圍，本題未提供；It 會多出未以關係詞或連接詞連接的限定動詞。"},{"n":203,"p":"mix","s":"關代省略與形容詞子句減化","q":"______ he was honest surprised me.","o":["What","It","Which","That"],"a":3,"j":"he was honest 完整，當主詞 → That。","x":"What 用在缺名詞的子句；Which 需要可辨認的選擇範圍，本題未提供；It 不能這樣直接接子句。"},{"n":204,"p":"mix","s":"關代省略與形容詞子句減化","q":"I'll never forget ______ you did for me.","o":["what","which","that","whom"],"a":0,"j":"did 缺受詞、沒有先行詞 → what。","x":"that 引導完整子句；which、whom 在此沒有可代替的名詞成分。"},{"n":205,"p":"mix","s":"關代省略與形容詞子句減化","q":"I'll never forget the kindness ______ you showed me.","o":["what","where","which","whose"],"a":2,"j":"有先行詞 kindness，showed me ___ 缺直接受詞 → which。","x":"what 不接在先行詞後；where 子句要完整；whose 要接名詞。"},{"n":206,"p":"mix","s":"關代省略與形容詞子句減化","q":"The question ______ we should cancel the trip was discussed at length.","o":["which","whether","what","where"],"a":1,"j":"子句完整，說明 question 的內容是「是否」→ 同位語用 whether。","x":"which 用在缺名詞的子句；what 不接在先行詞後；where 表地點。"},{"n":207,"p":"mix","s":"關代省略與形容詞子句減化","q":"The question ______ he asked was hard to answer.","o":["whether","what","where","which"],"a":3,"j":"asked ___ 缺受詞 → 形容詞子句，用 which。","x":"whether 用在完整子句；what 不接在先行詞後；where 子句要完整。"},{"n":208,"p":"mix","s":"關代省略與形容詞子句減化","q":"The reason ______ he gave sounded fake.","o":["why","because","which","what"],"a":2,"j":"gave ___ 缺受詞 → which。看到 the reason 不一定用 why。","x":"why 只接完整子句；because 不引導形容詞子句；what 不接在先行詞後。"},{"n":209,"p":"mix","s":"關代省略與形容詞子句減化","q":"The reason ______ he left early was that he felt sick.","o":["why","which","what","because"],"a":0,"j":"he left early 完整 → why。","x":"which 用在缺名詞的子句；what 不接在先行詞後；because 不引導形容詞子句。"},{"n":210,"p":"mix","s":"關代省略與形容詞子句減化","q":"He hates running, not to mention the fact ______ the race starts at midnight.","o":["which","that","what","whose"],"a":1,"j":"the race starts at midnight 完整，說明 fact 的內容 → 同位語 that。","x":"which 用在缺名詞的子句；what 不接在先行詞後；whose 要接名詞。"},{"n":211,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「正在……的時候」的連接詞。 ______ I was walking home, it began to rain.","o":["While","Unless","Because","Though"],"a":0,"j":"while＋進行式，表示「正在…的時候」。","x":"Unless（除非）、Because（因為）、Though（雖然）語意都不合。"},{"n":212,"p":"adv","s":"從屬連接詞的語意","q":"請依「我一到機場就打給你」作答。 I'll call you ______ I arrive at the airport.","o":["until","unless","as soon as","although"],"a":2,"j":"as soon as（一…就…）。","x":"until 表「直到」，打電話不是持續動作；unless、although 語意不合。"},{"n":213,"p":"adv","s":"從屬連接詞的語意","q":"請依「除非完成作業，否則不能出去」作答。 You can't go out ______ you finish your homework.","o":["so that","if","because","unless"],"a":3,"j":"unless＝if…not（除非）：除非寫完作業，否則不能出去。","x":"if 會變成「如果寫完就不能出去」，語意相反；because、so that 語意不合。"},{"n":214,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「只要」的連接詞。 ______ you promise to keep it a secret, I'll tell you.","o":["As long as","Unless","Although","Whereas"],"a":0,"j":"as long as（只要）表條件。","x":"Unless 語意相反；Although 表讓步；Whereas 表對比。"},{"n":215,"p":"adv","s":"從屬連接詞的語意","q":"Take an umbrella ______ it rains.","o":["unless","in case","so that","whereas"],"a":1,"j":"in case（以防萬一）。","x":"unless 語意不合；so that 會變成「為了讓它下雨」；whereas 表對比。"},{"n":216,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「為了」的連接詞。 She studied hard ______ she could get into a good university.","o":["even if","such that","so that","unless"],"a":2,"j":"so that＋S＋can/could（為了…），表目的。","x":"such that 不這樣用；even if、unless 語意不合。"},{"n":217,"p":"adv","s":"從屬連接詞的語意","q":"He was ______ tired that he fell asleep in class.","o":["such","too","very","so"],"a":3,"j":"so＋adj.＋that（如此…以致於）。","x":"such 後接名詞；very 不和 that 搭配；too…to V 才是固定用法。"},{"n":218,"p":"adv","s":"從屬連接詞的語意","q":"It was ______ a boring movie that I left halfway.","o":["so","very","too","such"],"a":3,"j":"such＋a＋adj.＋N＋that。","x":"so 後面接形容詞或副詞，不直接接 a＋N（除非用 so boring a movie）；too、very 不和 that 搭配。"},{"n":219,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「既然」的連接詞。 ______ you've finished your homework, you can play games.","o":["Unless","Now that","Although","Whereas"],"a":1,"j":"now that（既然）表原因。","x":"Unless、Although、Whereas 語意不合。"},{"n":220,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「雖然」的連接詞。 ______ he is rich, he is not happy.","o":["Because","Since","Although","Once"],"a":2,"j":"前後語意相反 → although（雖然）。","x":"Because、Since 表原因；Once 表「一旦」。"},{"n":221,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示兩者「對比」的連接詞。 Some people like coffee, ______ others prefer tea.","o":["whereas","because","unless","so"],"a":0,"j":"whereas（然而、反之）表對比。","x":"because、unless、so 語意不合。"},{"n":222,"p":"adv","s":"從屬連接詞的語意","q":"He talks ______ he knew everything.","o":["so that","because","unless","as if"],"a":3,"j":"as if（彷彿）；與事實相反時，子句用過去式 knew。","x":"because、unless、so that 語意不合。"},{"n":223,"p":"adv","s":"從屬連接詞的語意","q":"請依「你可以坐在任何你喜歡的地方」作答。 You can sit ______ you like.","o":["whoever","whatever","wherever","whomever"],"a":2,"j":"wherever（任何地方）表地點。","x":"whoever、whomever 指人；whatever 指事物，都不能表達本題指定的地點。"},{"n":224,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「一旦」的連接詞。 ______ you start, don't stop halfway.","o":["Once","Unless","Though","Whereas"],"a":0,"j":"once（一旦）。","x":"Unless、Though、Whereas 語意不合。"},{"n":225,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「為了」的連接詞。 The library extended its hours ______ students could study after class.","o":["in case","in order that","even though","as if"],"a":1,"j":"in order that＝so that（為了），表目的。","x":"in case 表防範；even though 表讓步；as if 表彷彿。"},{"n":226,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「雖然」的連接詞。 ______ he had little money, he gave some to the poor.","o":["Even though","Because","So that","Once"],"a":0,"j":"even though（即使、雖然）表讓步。","x":"Because 語意相反；So that 表目的；Once 表一旦。"},{"n":227,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「因為」的連接詞。 We stayed home ______ it was raining heavily.","o":["although","because","unless","whereas"],"a":1,"j":"表原因 → because。","x":"although、unless、whereas 語意不合。"},{"n":228,"p":"adv","s":"從屬連接詞的語意","q":"請選出表示「只要」的連接詞。 ______ you work hard, you will succeed.","o":["Unless","Although","Provided that","Whereas"],"a":2,"j":"provided that（只要、假如）表條件。","x":"Unless 語意相反；Although 表讓步；Whereas 表對比。"},{"n":229,"p":"adv","s":"從屬連接詞的語意","q":"請依「照我告訴你的方式去做」作答。 Do it ______ I told you.","o":["unless","so","while","as"],"a":3,"j":"as（照…的方式）表狀態。","x":"so、while、unless 語意不合。"},{"n":230,"p":"adv","s":"從屬連接詞的語意","q":"______ the time we got to the station, the train had left.","o":["Since","Until","By","When"],"a":2,"j":"by the time（到…的時候為止），主句常用完成式。","x":"until、since、when 不和 the time 組成這個連接詞。"},{"n":231,"p":"adv","s":"從屬連接詞的語意","q":"I have lived here ______ I was ten.","o":["since","for","when","until"],"a":0,"j":"since＋過去時間點，主句用現在完成式。","x":"for 接一段時間；when 不搭配現在完成式；until 語意不合。"},{"n":232,"p":"adv","s":"從屬連接詞的語意","q":"請依「在這裡等，直到我回來」作答。 Wait here ______ I come back.","o":["since","until","unless","whereas"],"a":1,"j":"until（直到）。","x":"since、unless、whereas 語意不合。"},{"n":233,"p":"adv","s":"從屬連接詞的語意","q":"He hurried ______ fear that he would miss the bus.","o":["with","of","from","for"],"a":3,"j":"for fear that（唯恐、以免）。","x":"with、of、from 在此不能與 fear that 組成題目所需的慣用片語。in fear that 也可見，但不列為本題干擾項。"},{"n":234,"p":"adv","s":"從屬連接詞的語意","q":"「他沒有錢；因此，他放棄了治療。」下列何者標點與文法皆正確？","o":["He had no money, therefore, he gave up treatment.","He had no money; therefore, he gave up treatment.","He had no money therefore he gave up treatment.","He had no money; therefore he gave up, treatment."],"a":1,"j":"therefore 是連接副詞；本題以分號連接兩個主要子句，再用 therefore 表示結果。其後的逗號是常見標點方式。","x":"A 用逗號連接兩個句子；C 完全沒有標點；D 的逗號把動詞和受詞拆開了。"},{"n":235,"p":"adv","s":"從屬連接詞的語意","q":"There was a serious difficulty; ______, he still refused to give up.","o":["therefore","so","because","nevertheless"],"a":3,"j":"前後語意轉折 → nevertheless（然而）；分號後接轉折副詞。","x":"therefore 表因此，語意不合；because、so 是連接詞，不放在分號後再加逗號。"},{"n":236,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"As soon as the taxi ______, we will leave for the airport.","o":["arrives","will arrive","arrived","arrive"],"a":0,"j":"時間副詞子句以現在式代替未來式。","x":"will arrive 不用來表達此處單純的未來時間條件；arrived 是過去式；arrive 未配合單數主詞 taxi。"},{"n":237,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"If it ______ tomorrow, the game will be canceled.","o":["will rain","rained","rains","raining"],"a":2,"j":"條件副詞子句以現在式代替未來式。","x":"will rain 不用在條件副詞子句；rained 是過去式；raining 缺 be 動詞。"},{"n":238,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"I'll text you when I ______ home.","o":["will get","get","got","getting"],"a":1,"j":"when 引導時間副詞子句 → 現在式。","x":"will get 不用在副詞子句；got 是過去式；getting 缺 be 動詞。"},{"n":239,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"Unless you ______ now, you'll miss the bus.","o":["leaving","will leave","left","leave"],"a":3,"j":"unless 引導條件副詞子句 → 現在式。","x":"will leave 不用在條件子句；left 是過去式；leaving 缺 be 動詞。"},{"n":240,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"I don't know if it ______ tomorrow.","o":["rains","rained","will rain","raining"],"a":2,"j":"這裡的 if 子句是 know 的受詞（名詞子句，表「是否」），未來的事照常用 will。","x":"本題預測明天是否下雨，用 will rain 最自然；rains 通常表習慣或時刻表，不是一般天氣預測；rained、raining 不合這裡的時態或結構。"},{"n":241,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"Before he ______ the house, he will turn off the lights.","o":["leaves","will leave","left","leaving"],"a":0,"j":"before 引導時間副詞子句 → 現在式。","x":"will leave 不用在時間副詞子句；left 是過去式；leaving 缺 be 動詞。"},{"n":242,"p":"adv","s":"時間、條件副詞子句：以現在式代替未來式","q":"By the time you ______ back, I will have finished dinner.","o":["will come","come","came","coming"],"a":1,"j":"by the time 子句用現在式，主句用未來完成式。","x":"will come 不用在時間副詞子句；came 是過去式；coming 缺 be 動詞。"},{"n":243,"p":"adv","s":"分詞構句","q":"Because I love you so much, I want to marry you. → ______, I want to marry you.","o":["Loving you so much","Loved you so much","To love you","I loving you so much"],"a":0,"j":"兩句主詞相同：去連接詞 → 去主詞 → 主動改 Ving。","x":"Loved 是被動；To love 表目的；保留主詞 I 卻用 loving 不合文法。"},{"n":244,"p":"adv","s":"分詞構句","q":"______ by hunger, he stole a cake.","o":["Driving","Drove","Was he driven","Driven"],"a":3,"j":"他「被」飢餓驅使 → 被動 Vpp。by 是被動的線索。","x":"Driving 是主動；Was he driven 是疑問句；Drove 是過去式動詞，會多出未適當連接的限定動詞。"},{"n":245,"p":"adv","s":"分詞構句","q":"______ along the street, we saw posters everywhere.","o":["To walk","Walked","Walking","Walk"],"a":2,"j":"我們主動走路，和看見同時發生 → Ving。","x":"Walked 是被動；To walk 表目的；Walk 是祈使句。"},{"n":246,"p":"adv","s":"分詞構句","q":"Walking along the street, ______.","o":["various signs were seen","signs could be seen","we saw various signs","there were many signs"],"a":2,"j":"分詞構句省略的主詞，必須和主句主詞相同。走路的是 we。","x":"A、B 變成「標誌在走路」；D 的主詞是 there，也不會走路。"},{"n":247,"p":"adv","s":"分詞構句","q":"______ the movie twice, he didn't want to see it again.","o":["Seeing","Having seen","Seen","To see"],"a":1,"j":"Having seen 清楚表示「已經看過兩次」，這件事先於不想再看。","x":"Seeing 不如完成分詞明確呈現已完成兩次的經驗；Seen 是被動；To see 不合原因關係。"},{"n":248,"p":"adv","s":"分詞構句","q":"______ what to do, she burst into tears.","o":["Not known","Don't knowing","Not know","Not knowing"],"a":3,"j":"否定的分詞構句：Not 放在分詞前面。講義口訣：如果副詞子句為否定句，就大膽把 Not 留著吧！","x":"Not known 是被動，不合 she 不知道該做什麼的意思；Not know、Don't knowing 的動詞形式不合。"},{"n":249,"p":"adv","s":"分詞構句","q":"______ out of work now, James can't pay his bills.","o":["Being","Been","Be","To be"],"a":0,"j":"As he is out of work → Being out of work。","x":"Been、Be 不能開頭；To be 表目的。"},{"n":250,"p":"adv","s":"分詞構句","q":"______ of studying, he fell asleep at his desk.","o":["Tiring","Tire","Being tiring","Tired"],"a":3,"j":"(Being) tired of…（厭倦），Being 可省；人感到厭倦用 tired。","x":"tiring 是「令人疲累的」；Tire 是動詞原形。"},{"n":251,"p":"adv","s":"分詞構句","q":"______ well, Jessie decided to take a day off.","o":["Not feeling","Not to feel","No feeling","Not felt"],"a":0,"j":"Because she didn't feel well → Not feeling well。","x":"Not to feel 是不定詞結構，不能表達此處已存在的身體狀況；No feeling 是名詞片語；Not felt 不合主動感到不舒服的語意。"},{"n":252,"p":"adv","s":"分詞構句","q":"______ with the price of a house, the price of a car seems low.","o":["Comparing","To compare","Compared","When comparing"],"a":2,"j":"比較的是房價與車價，主句主詞 the price of a car 是被比較的對象 → Compared。","x":"Comparing、When comparing 會讓價格成為比較動作的執行者；To compare 不能表達此處的被動比較關係。"},{"n":253,"p":"adv","s":"分詞構句","q":"______ the way, the traveler continued his journey.","o":["Telling","Having been told","Having told","Have told"],"a":1,"j":"旅人「被」告知路線，而且是先發生 → Having been Vpp。","x":"Telling、Having told 是主動；Have told 是動詞，不能開頭。"},{"n":254,"p":"adv","s":"分詞構句","q":"After ______ several times, I found it was not difficult.","o":["try","tried","to try","trying"],"a":3,"j":"保留連接詞 after，主動 → after trying。","x":"after 後不接原形、過去式或 to V。"},{"n":255,"p":"adv","s":"分詞構句","q":"You must be careful when ______ on the highway.","o":["you driving","are driving","driving","you were driving"],"a":2,"j":"when you are driving → when driving（保留連接詞）。","x":"you driving 缺 be 動詞；are driving 缺主詞；you were driving 時態不合。"},{"n":256,"p":"adv","s":"分詞構句","q":"After ______ by the doctor, the patient was allowed to go home.","o":["being examined","examined","examining","be examined"],"a":0,"j":"病人「被」醫生檢查；after 後面接 being Vpp。","x":"examining 是主動；examined 不能直接放在 after 後當被動；be examined 不合文法。"},{"n":257,"p":"adv","s":"分詞構句","q":"______ to the right, and you'll find the station.","o":["To turn","Turn","Turned","Turning"],"a":1,"j":"祈使句＋and＋S＋will（…，你就會…）。","x":"此處 and 連接祈使句與後面的結果子句，只有 Turn 能構成題目所需的祈使句；其餘選項不能單獨構成這個祈使句。"},{"n":258,"p":"adv","s":"分詞構句","q":"______ to the right, you'll find the station.","o":["Turning","Turn","Turned","To turn"],"a":0,"j":"沒有 and，兩句之間只有逗號 → 用分詞構句 Turning。","x":"Turn 若作祈使句，需適當標點或連接方式，不能照本題僅用逗號接下一主要子句；Turned 不合主動轉彎；To turn 不合此處條件關係。"},{"n":259,"p":"adv","s":"分詞構句","q":"Animals can do many amazing things when properly ______.","o":["train","training","to train","trained"],"a":3,"j":"when they are properly trained → when properly trained（動物被訓練）。","x":"train、to train 不合；training 是主動。"},{"n":260,"p":"adv","s":"分詞構句","q":"He sat there, ______ a novel.","o":["read","reading","reads","and reading"],"a":1,"j":"分詞構句放在句尾，表示伴隨的動作 → Ving。","x":"read、reads 會多出未適當連接的限定動詞；and reading 不合文法。"},{"n":261,"p":"adv","s":"分詞構句","q":"John returned, ______ by his girlfriend.","o":["accompanying","to accompany","accompanied","accompany"],"a":2,"j":"by his girlfriend → 他「被」陪伴 → Vpp。","x":"accompanying 是主動；to accompany 表目的；accompany 會多出未適當連接的限定動詞。"},{"n":262,"p":"adv","s":"分詞構句","q":"John walked to the park, ______ his girlfriend.","o":["accompany","accompanied","have accompanied","accompanying"],"a":3,"j":"John 主動陪女友一起走到公園，用 accompanying 表示伴隨動作。","x":"accompanied 是被動，不能直接接 his girlfriend 表陪伴她；accompany、have accompanied 都不能作此處的分詞片語。"},{"n":263,"p":"adv","s":"分詞構句","q":"______, teenagers need more sleep than adults.","o":["Generally speaking","Generally spoken","General spoken","Speak generally"],"a":0,"j":"Generally speaking（一般而言）是慣用的分詞片語，不受主詞一致的限制。","x":"Generally spoken、General spoken、Speak generally 都不是這裡表示「一般而言」的慣用插入語。"},{"n":264,"p":"adv","s":"分詞構句","q":"If you are driving in heavy rain, you should slow down. → If ______ in heavy rain, you should slow down.","o":["drive","driven","driving","to drive"],"a":2,"j":"If you are driving 可省略與主句相同的主詞 you 及 be 動詞 are，成為 If driving。","x":"drive 是原形；driven 不合主動開車的意思；to drive 不合此處的省略結構。"},{"n":265,"p":"adv","s":"分詞構句","q":"If I am invited, I will attend the opening ceremony. → ______, I will attend the ceremony.","o":["If inviting","If invited","Inviting","If invite"],"a":1,"j":"If I am invited → If invited（被動，保留連接詞）。","x":"If inviting、Inviting 是主動；If invite 不合文法。"},{"n":266,"p":"adv","s":"分詞構句","q":"While I was cleaning my room, I found my old diary. → ______ my room, I found my old diary.","o":["While cleaned","While cleaning","While clean","While to clean"],"a":1,"j":"While＋Ving（主動）。","x":"cleaned 是被動；clean 是原形；to clean 不合。"},{"n":267,"p":"adv","s":"分詞構句","q":"I was not tall enough to reach the shelf, so I stood on a chair. → ______ tall enough to reach the shelf, I stood on a chair.","o":["Not been","Not be","Not being","No being"],"a":2,"j":"否定詞放在分詞前面：Not being…。","x":"Not been、Not be、No being 都不能構成本題所需的否定分詞片語。"},{"n":268,"p":"adv","s":"分詞構句","q":"If possible, we'll take a vacation. 「If possible」還原後是：","o":["If possibly","If we possible","If being possible","If it is possible"],"a":3,"j":"連接詞＋S＋be＋adj. 可以省略「S＋be」：If (it is) possible。","x":"其他選項不合文法。"},{"n":269,"p":"adv","s":"分詞構句","q":"______ and healthy, he lifts heavy boxes easily.","o":["Strong","Strength","Strongly","Strengthen"],"a":0,"j":"Strong and healthy 是形容詞片語，補充主句主詞 he 的狀態，可理解為 Being strong and healthy。","x":"Strength 是名詞；Strongly 是副詞；Strengthen 是動詞。"},{"n":270,"p":"adv","s":"分詞構句","q":"After he had heard the noise, he got up. → After ______ the noise, he got up.","o":["to hear","has heard","having heard","heard"],"a":2,"j":"after 已表示先後，having heard 進一步標明聽見聲音的動作已完成。after hearing 也可成立，但本題未提供 hearing。","x":"to hear、has heard、heard 都不能直接放在 after 後當分詞構句。"},{"n":271,"p":"adv","s":"分詞構句","q":"He fooled around all day, ______ nothing meaningful.","o":["did","to do","done","doing"],"a":3,"j":"and did nothing → doing nothing（伴隨動作）。","x":"did 會多出未適當連接的限定動詞；done 是被動；to do 表目的。"},{"n":272,"p":"adv","s":"分詞構句","q":"The lady sat by the window, ______ at the clouds.","o":["looked","looking","look","looks"],"a":1,"j":"and looked → looking（伴隨動作）。","x":"looked、looks、look 都不能在這裡直接作補充片語，需有連接詞或改成分詞形式。"},{"n":273,"p":"adv","s":"分詞構句","q":"The nurse approached the sick child, ______ to make him feel better.","o":["trying","tried","try","tries"],"a":0,"j":"and tried → trying（伴隨動作）。","x":"tried、tries、try 都不能在逗號後直接作此處的補充片語，需改用分詞形式。"},{"n":274,"p":"adv","s":"分詞構句","q":"______ the door unlocked, I went in.","o":["Find","Had found","Having found","Have found"],"a":2,"j":"先發現門沒鎖，才進去 → Having found。","x":"Find 是祈使句；Had found、Have found 不能放在句首當分詞構句。"},{"n":275,"p":"adv","s":"分詞構句","q":"Though he knows where I live, he never visits me. 下列何者正確？","o":["Although know where I live, he never visits me.","Although he knows where I live, but he never visits me.","Though he knowing where I live, he never visits me.","Though knowing where I live, he never visits me."],"a":3,"j":"保留 though，去主詞、主動改 Ving。","x":"A 用原形；C 保留主詞又用 Ving；B 的 although 和 but 不能並用。"},{"n":276,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"The vacation ______ over, the students came back to school.","o":["is","being","are","was"],"a":1,"j":"兩句主詞不同（vacation／students），只用逗號連接 → 保留主詞的獨立分詞構句：N＋being。","x":"is、was、are 會讓兩個完整句只用逗號連接。"},{"n":277,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"The vacation ______ over; the students came back to school.","o":["was","has","are","being"],"a":0,"j":"分號連接兩個完整句 → 前一句需要真正的動詞 was。","x":"has over 不合；are 主詞動詞不一致；being 會讓前一句沒有動詞。"},{"n":278,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"It ______ fine, we went on a picnic.","o":["was","been","is","being"],"a":3,"j":"主詞 it 和 we 不同，逗號連接 → It being fine。","x":"was、is 會讓兩個句子只用逗號連接；been 不合文法。"},{"n":279,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"The weather ______, we will go on a picnic.","o":["permitting","permits","permitted","to permit"],"a":0,"j":"If the weather permits → The weather permitting（主詞不同，保留主詞）。","x":"permits 會讓兩個句子只用逗號連接；permitted 是被動；to permit 不合。"},{"n":280,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"After the sun had set, we headed home. → The sun ______, we headed home.","o":["setting","had set","having set","to set"],"a":2,"j":"主詞不同，保留 the sun；日落發生在前 → having set。","x":"had set 會讓兩句只用逗號連接；setting 表同時；to set 不合。"},{"n":281,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"This ______ her first flight, she couldn't help feeling excited.","o":["is","being","was","been"],"a":1,"j":"主詞 This 和 she 不同 → This being…。","x":"is、was 會讓兩個句子只用逗號連接；been 不合文法。"},{"n":282,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"All government offices will be closed tomorrow, that day ______ a national holiday.","o":["is","being","been","to be"],"a":1,"j":"that day 與主句的 government offices 不同，保留自己的主詞，構成 that day being…，補充休假的原因。","x":"is 會讓兩個句子只用逗號連接；been、to be 不合。"},{"n":283,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"Her husband ______ away on business, she felt lonely.","o":["is","was","been","being"],"a":3,"j":"Her husband 和 she 不同 → Her husband being away。","x":"is、was 會讓兩句只用逗號連接；been 不合文法。"},{"n":284,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"Grandpa sat in front of the TV with his eyes ______.","o":["closed","closes","close","to close"],"a":0,"j":"with his eyes closed 描述眼睛閉著的狀態；closed 可視為過去分詞形容詞。","x":"closes 是限定動詞；close 是原形動詞或表示靠近的形容詞；to close 不表示此處眼睛已閉著的狀態。"},{"n":285,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"Henry talked to the girl with his heart ______ fast.","o":["beat","beaten","beating","to beat"],"a":2,"j":"with＋N＋Ving：心臟主動在跳 → beating。","x":"beaten 是被動；beat、to beat 不合。"},{"n":286,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"Sam stood there with his head ______ against the wall.","o":["resting","rests","is resting","to rest"],"a":0,"j":"頭主動「靠著」牆 → resting。","x":"rests、is resting 是限定動詞，不能直接放進 with＋名詞＋補語的結構；to rest 不表示此處已呈現的姿態。"},{"n":287,"p":"adv","s":"獨立分詞構句與 with＋N＋Ving／Vpp","q":"She pleaded for help, with tears ___ ht a map. → For fear ______ getting lost, I brought a map.","o":["that","to","of","for"],"a":2,"j":"for fear that＋子句；for fear of＋Ving。","x":"that 後要接子句；to、for 不組成這個片語。"},{"n":296,"p":"adv","s":"副詞子句改寫成介系詞片語","q":"Because it rained heavily, the game was canceled. → ______ the heavy rain, the game was canceled.","o":["Because of","Because","Since","Although"],"a":0,"j":"because＋子句；because of＋N。","x":"Because、Since 後要接子句；Although 表讓步。"},{"n":297,"p":"adv","s":"副詞子句改寫成介系詞片語","q":"Though she is young, she is very wise. → ______ her youth, she is very wise.","o":["Though","In spite of","Because of","Instead of"],"a":1,"j":"in spite of＋N，表讓步。","x":"Though 後要接子句；Because of、Instead of 語意不合。"},{"n":298,"p":"adv","s":"副詞子句改寫成介系詞片語","q":"Before he left, he said goodbye to everyone. → Before ______, he said goodbye to everyone.","o":["leave","left","to leave","leaving"],"a":3,"j":"before 當介系詞，後面接 Ving。","x":"before 後不接原形、過去式或 to V。"},{"n":299,"p":"adv","s":"副詞子句改寫成介系詞片語","q":"When he heard the news, he burst into tears. → On ______ the news, he burst into tears.","o":["hear","hearing","heard","to hear"],"a":1,"j":"on＋Ving（一…就…）。","x":"介系詞 on 後面要接 Ving。"},{"n":300,"p":"adv","s":"副詞子句改寫成介系詞片語","q":"The determined leader guided her people through years of hardship, ______ up as the country's first queen.","o":["ended","has ended","ending","ends"],"a":2,"j":"ending up 補充前述歷程的結果。分詞片語也能表示時間、原因或伴隨狀況，不能只靠句首／句尾位置判斷。","x":"ended、ends、has ended 都是限定動詞形式，不能直接在逗號後作此處的結果片語。"},{"n":301,"p":"cloze","s":"短文克漏字","q":"","o":["which","what","where","whose"],"a":0,"j":"a role 是先行詞，understand 缺受詞 → 形容詞子句，用 which（或 that）。","x":"what 不接在先行詞後；where 子句要完整；whose 要接名詞。","pt":"Passage 1　The Quiet Workers","pp":"Bees are small, but they play a role __301__ few people fully understand. Many fruit and vegetable crops benefit from animal pollination, __302__ means that losing pollinators could reduce both the amount and variety of food available. Scientists have warned __303__ many pollinators face serious thre const PARTS = [
  {id:'all',name:'全部'},{id:'noun',name:'名詞子句'},{id:'adj',name:'形容詞子句'},
  {id:'mix',name:'名詞 vs. 形容詞子句'},{id:'adv',name:'副詞子句與分詞構句'},{id:'cloze',name:'學測型短文克漏字'}];
const PARTNAME = Object.fromEntries(PARTS.map(p=>[p.id,p.name]));
const L='ABCD';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let range='all', queue=[], idx=0, score=0, log=[], answered=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getBest(){try{return JSON.parse(localStorage.getItem('capy-best')||'null')}catch(e){return null}}
function setBest(v){try{localStorage.setItem('capy-best',JSON.stringify(v))}catch(e){}}

function renderChips(){
  $('chips').innerHTML=PARTS.map(p=>{
    const c=p.id==='all'?BANK.length:BANK.filter(q=>q.p===p.id).length;
    return `<button class="chip" data-id="${p.id}" aria-pressed="${p.id===range}">${p.name}<small>${c}</small></button>`}).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{range=b.dataset.id;renderChips();updateStart();});
}
function pool(){return range==='all'?BANK:BANK.filter(q=>q.p===range)}
function updateStart(){const n=Math.min(100,pool().length);$('startBtn').textContent=`開始作答（${n} 題）`;}
function showBest(){const b=getBest();$('best').textContent=b?`最佳紀錄：${b.s} / ${b.t}`:'';}

function say(t){$('speech').textContent=t}
function mood(m){const c=$('cap');c.classList.remove('happy','oops');void c.offsetWidth;if(m)c.classList.add(m);}
function floaters(){
  const g=$('floaters');const shown=Math.min(score,28);let h='';
  for(let i=0;i<shown;i++){const x=24+((i*53)%312), y=146+((i*7)%3)*7; h+=`<g transform="translate(${x} ${y})"><circle r="7.5" fill="var(--yuzu)"/><path d="M0-7q4-4 7-1q-4 3-7 1z" fill="var(--ok)"/></g>`;}
  g.innerHTML=h;
}
function meta(){
  if(!queue.length){$('meta').innerHTML='';return}
  $('meta').innerHTML=`第 <b>${Math.min(idx+1,queue.length)}</b> / ${queue.length} 題<br>柚子 <b>${score}</b>`;
  $('bar').style.width=(idx/queue.length*100)+'%';
}

function start(list){
  queue=list; idx=0; score=0; log=[];
  $('intro').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
  floaters(); say('第一題，慢慢讀。'); mood(); show();
}
function stemHTML(s){
  // Chinese-led prompts keep sans; English sentences use serif
  return esc(s).replace(/([\u4e00-\u9fff「」（）？。，：；、＋→]+[^A-Za-z]*?)(?=[A-Z_]|$)/g,'<span class="zh">$1</span>');
}
function show(){
  answered=false; const q=queue[idx]; meta();
  $('tag').innerHTML=`<span class="qnum">#${q.n}</span>${esc(PARTNAME[q.p])}${q.s&&q.p!=='cloze'?'｜'+esc(q.s):''}`;
  if(q.pp){
    const body=esc(q.pp).replace(/__(\d+)__/g,(m,k)=>`<span class="blank${+k===q.n?' now':''}">${k}</span>`);
    $('passage').innerHTML=`<div class="passage"><h3>${esc(q.pt)}</h3>${body}</div>`;
    $('stem').innerHTML=`<span class="zh">選出空格 ${q.n} 最適當的答案。</span>`;
  } else {$('passage').innerHTML='';$('stem').innerHTML=stemHTML(q.q).replace(/_{3,}/g,'<span class="blank now">&nbsp;</span>');}
  $('opts').innerHTML=q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${L[i]}</span><span class="t">${esc(o)}</span></button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('exp').classList.add('hidden');$('nextBtn').classList.add('hidden');
  const p=document.querySelector('.passage .now'); if(p) p.scrollIntoView({block:'nearest'});
  window.scrollTo({top:0,behavior:'smooth'});
}
const GOOD=['柚子 +1。','泡得剛剛好。','這題拿下。','穩穩的。','結構看得很清楚。'];
const BAD=['先看一下詳解。','差一點，回頭找結構。','水有點燙，再想想這個位置。','沒關係，看懂比答對重要。'];
function expHTML(q,picked){
  const ok=picked===q.a;
  return `${picked==null?'':`<div class="verdict ${ok?'ok':'no'}">${ok?'答對了':'正確答案是 ('+L[q.a]+') '+esc(q.o[q.a])}</div>`}
  <p><span class="lb">判斷</span>${esc(q.j)}</p><p><span class="lb">其他選項</span>${esc(q.x)}</p>`;
}
function pick(i){
  if(answered)return; answered=true; const q=queue[idx]; const ok=i===q.a;
  if(ok){score++;mood('happy');say(GOOD[Math.floor(Math.random()*GOOD.length)]);const p=$('plus');p.classList.remove('go');void p.offsetWidth;p.classList.add('go');floaters();}
  else{mood('oops');say(BAD[Math.floor(Math.random()*BAD.length)]);}
  log.push({q,pick:i,ok});
  $('opts').querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong');});
  const e=$('exp');e.innerHTML=expHTML(q,i);e.classList.remove('hidden');
  const n=$('nextBtn');n.textContent=idx===queue.length-1?'看結果':'下一題';n.classList.remove('hidden');n.focus({preventScroll:true});
  meta();
}
function next(){if(!answered)return; idx++; if(idx>=queue.length)finish(); else show();}
function finish(){
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  const t=log.length; $('bar').style.width='100%'; meta();
  $('meta').innerHTML=`柚子 <b>${score}</b>`;
  $('final').innerHTML=`${score}<span>/ ${t}</span>`;
  const r=t?score/t:0;
  const c=r>=.9?'整池都是柚子。三大子句的位置已經很熟了。':r>=.75?'大部分結構都抓得到，錯的題目把詳解讀完就好。':r>=.5?'有底子了。錯題多半集中在某幾種結構，挑出來再練一次。':'先回頭看文法簡介的「句子母」，再練錯題。';
  $('comment').textContent=c; say(r>=.75?'今天泡得很滿足。':'下次再多泡一會兒。'); mood(r>=.75?'happy':null);
  const b=getBest(); if(t>=20 && (!b||score/t>b.s/b.t)) setBest({s:score,t});
  const wrong=log.filter(x=>!x.ok);
  $('wrongBtn').classList.toggle('hidden',!wrong.length);
  $('review').innerHTML=wrong.length?`<div class="small" style="margin-bottom:4px">錯題 ${wrong.length} 題（點開看詳解）</div>`+wrong.map(x=>`<details><summary><b>#${x.q.n}</b> <span class="s">${esc(x.q.pp?('短文空格 '+x.q.n):x.q.q)}</span></summary><div class="exp">
    <p class="small">你選 (${L[x.pick]}) ${esc(x.q.o[x.pick])}</p>${expHTML(x.q,x.pick)}</div></details>`).join(''):'<p class="small">這回沒有錯題。</p>';
  window.scrollTo({top:0,behavior:'smooth'});
}
$('startBtn').onclick=()=>start(shuffle(pool()).slice(0,100));
$('againBtn').onclick=()=>start(shuffle(pool()).slice(0,100));
$('wrongBtn').onclick=()=>start(shuffle(log.filter(x=>!x.ok).map(x=>x.q)));
$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('intro').classList.remove('hidden');queue=[];score=0;floaters();meta();$('bar').style.width='0';say('泡好了，來寫題吧。');mood();showBest();};
$('quitBtn').onclick=()=>{if(log.length)finish();else $('homeBtn').onclick();};
$('nextBtn').onclick=next;
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=e.key.toUpperCase(); const i='1234'.indexOf(k)>=0?'1234'.indexOf(k):L.indexOf(k);
  if(!answered&&i>=0&&k.length===1){pick(i);e.preventDefault();}
  else if(answered&&(e.key==='Enter'||e.key==='ArrowRight')){next();e.preventDefault();}
});
renderChips();updateStart();showBest();
</script>
