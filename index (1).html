const SRC_NAME={"115":"115 學測","L1":"L1 The Road Not Taken","L2":"L2 Battling Fake News"};
const RANGES=[
  {key:"mix",label:"全部混合",keys:["115","L1","L2"]},
  {key:"115",label:"115 學測",keys:["115"]},
  {key:"L1",label:"L1 The Road Not Taken",keys:["L1"]},
  {key:"L2",label:"L2 Battling Fake News",keys:["L2"]}
];
const COLORS=["var(--b1)","var(--b2)","var(--b3)","var(--b4)","var(--b5)"];
const $=id=>document.getElementById(id);
const arena=$("arena");
let range="mix", queue=[], cur=null, balloons=[], score=0, combo=0, firstTry=0, answered=0;
let mistakes=new Map(), startT=0, timerId=null, running=false, locked=false, curWrong=false, curHint=false;
let sound=true, actx=null, total=0, W=0, H=0, lastT=0;

// ---- range picker
const choicesEl=$("choices");
RANGES.forEach(r=>{
  const n=BANK.filter(b=>r.keys.includes(b.src)).length;
  const b=document.createElement("button");
  b.className="choice"; b.dataset.key=r.key;
  b.innerHTML=`${r.label}<small>${n} 個字・每輪 ${Math.min(15,n)} 顆</small>`;
  b.setAttribute("aria-pressed",r.key===range);
  b.onclick=()=>{range=r.key;[...choicesEl.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.key===range));};
  choicesEl.appendChild(b);
});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

// ---- sound
function tone(f1,f2,dur,type="sine",vol=.15){
  if(!sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const SIZES=[["大",1],["特大",1.25],["投影",1.5]];let sizeI=0;
try{sizeI=+localStorage.getItem("bp-size")||0;}catch(e){}
function applySize(){const [n,v]=SIZES[sizeI];document.documentElement.style.setProperty("--fs",v);$("sizeBtn").textContent="字級 "+n;
  balloons.forEach(b=>{b.w=b.el.offsetWidth;b.h=b.el.offsetHeight;});}
$("sizeBtn").onclick=()=>{sizeI=(sizeI+1)%SIZES.length;try{localStorage.setItem("bp-size",sizeI)}catch(e){}applySize();};
applySize();
$("soundBtn").onclick=()=>{sound=!sound;$("soundBtn").textContent="音效 "+(sound?"開":"關");};

// ---- round setup
function startRound(){
  const keys=RANGES.find(r=>r.key===range).keys;
  const seen=new Set();
  const pool=shuffle(BANK.filter(b=>keys.includes(b.src))).filter(b=>{if(seen.has(b.w))return false;seen.add(b.w);return true;});
  let picked;
  if(keys.length>1){
    const per=Math.floor(15/keys.length);
    picked=[];keys.forEach(k=>picked.push(...pool.filter(b=>b.src===k).slice(0,per)));
    pool.forEach(b=>{if(picked.length<15&&!picked.includes(b))picked.push(b);});
  }else picked=pool.slice(0,15);
  queue=shuffle([...picked]); total=picked.length;
  score=0;combo=0;firstTry=0;answered=0;mistakes=new Map();
  $("startOv").hidden=true;$("endOv").hidden=true;
  makeBalloons(picked);
  startT=performance.now();clearInterval(timerId);
  timerId=setInterval(()=>$("time").textContent=fmt(performance.now()-startT),250);
  running=true;$("hintBtn").disabled=false;$("skipBtn").disabled=false;
  nextQ(); updateBar();
}

function makeBalloons(items){
  balloons.forEach(b=>b.el.remove());balloons=[];
  W=arena.clientWidth;H=arena.clientHeight;
  items.forEach((it,i)=>{
    const el=document.createElement("button");
    el.className="balloon";el.type="button";
    const c=COLORS[i%COLORS.length];
    el.style.setProperty("--c",c);
    el.innerHTML=`<span class="body">${it.w}</span><span class="str"></span>`;
    el.setAttribute("aria-label",it.w);
    arena.appendChild(el);
    const w=el.offsetWidth,h=el.offsetHeight;
    // pick least-overlapping spot
    let best=null,bestScore=Infinity;
    for(let k=0;k<30;k++){
      const x=Math.random()*Math.max(1,W-w), y=Math.random()*Math.max(1,floorY()-h);
      let ov=0;balloons.forEach(o=>{const dx=Math.max(0,Math.min(x+w,o.x+o.w)-Math.max(x,o.x));const dy=Math.max(0,Math.min(y+h,o.y+o.h)-Math.max(y,o.y));ov+=dx*dy;});
      if(ov<bestScore){bestScore=ov;best={x,y};}
      if(ov===0)break;
    }
    const sp=12+Math.random()*18, ang=Math.random()*Math.PI*2;
    const b={el,word:it.w,x:best.x,y:best.y,w,h,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,ph:Math.random()*6.28,alive:true};
    el.addEventListener("pointerdown",e=>{e.preventDefault();throwDart(b);});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();throwDart(b);}});
    balloons.push(b);
  });
}

function nextQ(){
  if(!queue.length){endRound();return;}
  cur=queue.shift();curWrong=false;curHint=false;locked=false;
  renderSentence(false);
  $("src").textContent=SRC_NAME[cur.src];
  $("hint").textContent="";
}
function renderSentence(filled){
  const parts=cur.s.split("___");
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("sentence").innerHTML=esc(parts[0])+`<span class="blank${filled?" filled":""}">${filled?cur.w:"&nbsp;"}</span>`+esc(parts[1]||"");
}

const capy=$("capy");
let flying=false;
function floorY(){return H-(capy.offsetHeight||100)-14;}
function capyMood(c){capy.classList.remove("throw","happy","sad");void capy.offsetWidth;capy.classList.add(c);}
function floaty(x,y,text,bad){const f=document.createElement("span");f.className="floaty"+(bad?" bad":"");f.textContent=text;
  f.style.left=x+"px";f.style.top=y+"px";arena.appendChild(f);setTimeout(()=>f.remove(),850);}
const DART_SVG='<svg viewBox="0 0 46 12"><path d="M2 2 L10 6 L2 10 L6 6 Z" fill="#B5838D"/><path d="M4 2 L12 6 L4 10" fill="none" stroke="#7A5C58" stroke-width="1"/><rect x="9" y="5" width="28" height="2" rx="1" fill="#5A4A40"/><path d="M36 3 L46 6 L36 9 Z" fill="#3E2F27"/></svg>';
function throwDart(b){
  if(!running||locked||flying||!b.alive)return;
  flying=true;
  const ar=arena.getBoundingClientRect(), cr=capy.getBoundingClientRect();
  const sx=cr.left-ar.left+cr.width*0.5, sy=cr.top-ar.top+cr.height*0.2;
  capy.style.setProperty("--flip", (b.x+b.w/2)<sx?-1:1);
  capy.querySelector(".face").style.setProperty("--flip",(b.x+b.w/2)<sx?-1:1);
  capyMood("throw");
  tone(1200,320,.09,"sine",.06);
  const d=document.createElement("div");d.className="dart";d.innerHTML=DART_SVG;arena.appendChild(d);
  const t0=performance.now(), dur=230, arc=40;
  function step(t){
    const k=Math.min(1,(t-t0)/dur);
    const tx=b.x+b.w/2, ty=b.y+b.h*0.5;
    const x=sx+(tx-sx)*k, y=sy+(ty-sy)*k-Math.sin(Math.PI*k)*arc;
    const dx=tx-sx, dy=(ty-sy)-arc*Math.PI*Math.cos(Math.PI*k);
    d.style.transform=`translate(${x}px,${y}px) rotate(${Math.atan2(dy,dx)}rad)`;
    if(k<1){requestAnimationFrame(step);return;}
    flying=false;
    if(b.alive&&b.word===cur.w){d.remove();floaty(tx,ty,"+"+(10+Math.min(combo,10)*2)+(combo>=2?"  "+(combo+1)+" 連擊":""));shoot(b);capyMood("happy");}
    else{dropDart(d,x,y,Math.atan2(dy,dx));if(b.alive)shoot(b);floaty(tx,ty,"✕",true);capyMood("sad");}
  }
  requestAnimationFrame(step);
}
function dropDart(d,x,y,a){
  let vy=-120,vx=(Math.random()-.5)*80,t0=performance.now(),last=t0;
  function f(t){const dt=(t-last)/1000;last=t;vy+=1100*dt;x+=vx*dt;y+=vy*dt;a+=6*dt;
    const age=t-t0;d.style.opacity=Math.max(0,1-age/600);
    d.style.transform=`translate(${x}px,${y}px) rotate(${a}rad)`;
    if(age<600)requestAnimationFrame(f);else d.remove();}
  requestAnimationFrame(f);
}
function shoot(b){
  if(!running||locked||!b.alive)return;
  if(b.word===cur.w){
    locked=true;b.alive=false;
    combo++;answered++;
    if(!curWrong&&!curHint)firstTry++;
    score+=10+Math.min(combo-1,10)*2;
    tone(520,1300,.12);
    popFx(b);
    renderSentence(true);
    updateBar();
    setTimeout(nextQ,750);
  }else{
    combo=0;curWrong=true;
    mistakes.set(cur.w,cur);
    tone(180,90,.16,"triangle",.14);
    b.el.classList.remove("wrong");void b.el.offsetWidth;b.el.classList.add("wrong");
    const s=$("strip");s.classList.remove("flash-bad");void s.offsetWidth;s.classList.add("flash-bad");
    updateBar();
  }
}
function popFx(b){
  b.el.classList.add("pop");
  const cx=b.x+b.w/2, cy=b.y+b.h*0.35, c=b.el.style.getPropertyValue("--c");
  for(let i=0;i<9;i++){
    const s=document.createElement("span");s.className="spark";
    const a=i/9*6.28, r=30+Math.random()*25;
    s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--c",c);
    s.style.setProperty("--dx",Math.cos(a)*r+"px");s.style.setProperty("--dy",Math.sin(a)*r+"px");
    arena.appendChild(s);setTimeout(()=>s.remove(),550);
  }
  setTimeout(()=>{b.el.remove();balloons=balloons.filter(x=>x!==b);},300);
}

$("hintBtn").onclick=()=>{
  if(!running||locked||curHint)return;
  curHint=true;score=Math.max(0,score-5);mistakes.set(cur.w,cur);
  $("hint").textContent="提示："+cur.zh;updateBar();
};
$("skipBtn").onclick=()=>{
  if(!running||locked)return;
  combo=0;mistakes.set(cur.w,cur);queue.push(cur);updateBar();nextQ();
};

function updateBar(){
  $("score").textContent=score;$("combo").textContent=combo;
  $("left").textContent=total-answered;
  $("prog").style.width=(total?answered/total*100:0)+"%";
}

function endRound(){
  running=false;clearInterval(timerId);
  $("hintBtn").disabled=true;$("skipBtn").disabled=true;
  const t=performance.now()-startT;
  $("rScore").textContent=score;$("rTime").textContent=fmt(t);
  $("rAcc").textContent=Math.round(firstTry/total*100)+"%";
  $("endTitle").textContent=mistakes.size===0?"全部一次命中":"全部射完了";
  const list=$("review");list.innerHTML="";
  if(mistakes.size===0){$("reviewLabel").textContent="沒有一個字需要提示，也沒有射錯。";}
  else{
    $("reviewLabel").textContent="這幾個字值得再看一次：";
    mistakes.forEach(m=>{
      const li=document.createElement("li");
      li.innerHTML=`<b>${m.w}</b>　${m.zh}<em>${m.s.replace("___","<u>"+m.w+"</u>")}</em>`;
      list.appendChild(li);
    });
  }
  $("sentence").textContent="這一輪結束。";$("src").textContent="—";$("hint").textContent="";
  $("endOv").hidden=false;
}

$("startBtn").onclick=startRound;
$("againBtn").onclick=startRound;
$("menuBtn").onclick=()=>{$("endOv").hidden=true;$("startOv").hidden=false;balloons.forEach(b=>b.el.remove());balloons=[];};

// ---- motion
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(t){
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  W=arena.clientWidth;H=arena.clientHeight;
  const speed=reduce?.35:1;
  for(const b of balloons){
    if(!b.alive)continue;
    b.x+=b.vx*dt*speed;b.y+=b.vy*dt*speed;
    if(b.x<4){b.x=4;b.vx=Math.abs(b.vx);}
    if(b.x+b.w>W-4){b.x=Math.max(4,W-4-b.w);b.vx=-Math.abs(b.vx);}
    if(b.y<4){b.y=4;b.vy=Math.abs(b.vy);}
    if(b.y+b.h>floorY()){b.y=Math.max(4,floorY()-b.h);b.vy=-Math.abs(b.vy);}
  }
  // gentle separation so words stay readable
  for(let i=0;i<balloons.length;i++){const a=balloons[i];if(!a.alive)continue;
    for(let j=i+1;j<balloons.length;j++){const c=balloons[j];if(!c.alive)continue;
      const dx=(a.x+a.w/2)-(c.x+c.w/2), dy=(a.y+a.h/2)-(c.y+c.h/2);
      const ox=(a.w+c.w)/2-Math.abs(dx), oy=(a.h+c.h)/2*0.8-Math.abs(dy);
      if(ox>0&&oy>0){
        if(ox<oy){const p=Math.sign(dx||1)*ox*0.08;a.x+=p;c.x-=p;}
        else{const p=Math.sign(dy||1)*oy*0.08;a.y+=p;c.y-=p;}
      }
    }
  }
  for(const b of balloons){
    const bob=reduce?0:Math.sin(t*0.0016+b.ph)*4;
    b.el.style.transform=`translate(${b.x}px,${b.y+bob}px)`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
