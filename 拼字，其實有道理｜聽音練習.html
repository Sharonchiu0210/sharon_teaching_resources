<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼字，其實有道理｜聽音練習</title>
<style>
:root{
  --bg:#f6f1ea; --paper:#fffdf9; --ink:#3a2e28; --soft:#85766b; --line:#e3d8cc;
  --sound:#5f7d95; --sound-soft:#e4ecf2; --clay:#a9593a; --ok:#5d7f55; --no:#b04a3a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1f1a17; --paper:#2a2420; --ink:#efe6dc; --soft:#b3a497; --line:#40362f;
  --sound:#9db7cb; --sound-soft:#2f3a43; --clay:#d98d6c; --ok:#9cc08f; --no:#e08a7a; } }
:root[data-theme="dark"]{ --bg:#1f1a17; --paper:#2a2420; --ink:#efe6dc; --soft:#b3a497; --line:#40362f;
  --sound:#9db7cb; --sound-soft:#2f3a43; --clay:#d98d6c; --ok:#9cc08f; --no:#e08a7a; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; -webkit-text-size-adjust:100%; }
.wrap{ max-width:640px; margin:0 auto; padding:18px 18px 60px; }
header h1{ font-size:15px; font-weight:500; color:var(--soft); margin:6px 0 2px; letter-spacing:.04em; }
.unit-title{ font-size:25px; font-weight:800; margin:4px 0 2px; line-height:1.3; }
.unit-sub{ font-size:14px; color:var(--soft); margin-bottom:14px; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 12px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:18px; padding:7px 13px; font-size:14px; cursor:pointer; font-family:inherit; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:8px 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); }
.seg{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); }
.seg button{ border:0; background:none; padding:8px 14px; font-size:14px; color:var(--soft); font-family:inherit; cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--sound-soft); color:var(--ink); font-weight:700; }
.spacer{ flex:1; }
.playall{ border:0; background:var(--sound); color:#fff; border-radius:10px; padding:9px 14px; font-size:14px; font-family:inherit; cursor:pointer; }
:root[data-theme="dark"] .playall{ color:#1f1a17; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .playall{ color:#1f1a17; } }
ul.words{ list-style:none; margin:6px 0 0; padding:0; }
.row{ display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
.row .w{ font-size:22px; letter-spacing:.02em; font-family:"Carlito","Segoe UI","Helvetica Neue",Arial,sans-serif; }
.row .zh{ font-size:13px; color:var(--soft); margin-left:auto; text-align:right; }
.spk{ flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--sound-soft); color:var(--sound); display:grid; place-items:center; cursor:pointer; }
.spk svg{ width:20px; height:20px; }
.row.on .spk{ background:var(--sound); color:var(--paper); }
.row.on .w{ color:var(--sound); }
.note{ font-size:13px; color:var(--soft); line-height:1.7; margin:14px 0; }
.warn{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.7; margin:12px 0; display:none; }
/* dictation */
.dict{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px 18px; margin-top:16px; text-align:center; }
.dcount{ font-size:13px; color:var(--soft); }
.bigplay{ width:84px; height:84px; border-radius:50%; border:0; background:var(--sound); color:#fff; margin:16px auto 8px; display:grid; place-items:center; cursor:pointer; }
.bigplay svg{ width:38px; height:38px; }
.hint{ min-height:22px; font-size:15px; color:var(--soft); }
.hintbtn{ border:0; background:none; color:var(--sound); font-size:14px; text-decoration:underline; cursor:pointer; font-family:inherit; }
.answer{ width:100%; max-width:320px; font-size:24px; text-align:center; padding:10px; border:0; border-bottom:2px solid var(--ink); background:transparent; color:var(--ink); margin:14px auto 6px; display:block; font-family:"Carlito","Segoe UI",Arial,sans-serif; letter-spacing:.04em; border-radius:0; }
.answer:focus{ outline:none; border-bottom-color:var(--sound); }
.actions{ display:flex; gap:10px; justify-content:center; margin-top:14px; }
.btn{ border:1px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:10px; padding:10px 20px; font-size:15px; font-family:inherit; cursor:pointer; }
.btn.ghost{ background:none; color:var(--ink); }
.result{ min-height:52px; margin-top:12px; font-size:16px; line-height:1.6; }
.result .ok{ color:var(--ok); font-weight:700; }
.result .no{ color:var(--no); font-weight:700; }
.result .rightw{ font-size:22px; font-family:"Carlito","Segoe UI",Arial,sans-serif; letter-spacing:.03em; }
.summary h3{ margin:4px 0 6px; font-size:20px; }
.miss{ text-align:left; margin:12px auto 0; max-width:320px; font-size:15px; line-height:1.9; }
button:focus-visible,.chip:focus-visible{ outline:2px solid var(--sound); outline-offset:2px; }
footer{ margin-top:28px; font-size:12px; color:var(--soft); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>拼字，其實有道理｜聽音練習</h1>
  <div class="unit-title" id="utitle"></div>
  <div class="unit-sub" id="usub"></div>
</header>
<nav class="chips" id="chips" aria-label="選擇課次"></nav>
<div class="warn" id="warn">這個瀏覽器無法播放語音。請改用手機內建的 Safari（iPhone）或 Chrome（Android）開啟。</div>
<div class="bar">
  <div class="seg" role="group" aria-label="模式">
    <button id="mListen" aria-pressed="true">聽讀</button>
    <button id="mDict" aria-pressed="false">聽寫</button>
  </div>
  <div class="seg" role="group" aria-label="語速">
    <button id="sN" aria-pressed="true">正常</button>
    <button id="sS" aria-pressed="false">慢速</button>
  </div>
  <div class="spacer"></div>
  <button class="playall" id="playall">全部播放</button>
</div>
<section id="listen">
  <p class="note">點一下單字就會念出來。先聽，再對照講義上的拼法，想一想是哪一條規則。</p>
  <ul class="words" id="list"></ul>
</section>
<section id="dict" hidden>
  <div class="dict" id="dbox"></div>
</section>
<footer>英語創意發想社｜Sharon Chiu</footer>
</div>

const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
let unit = 0, rate = 0.9, mode = 'listen', voice = null, playing = false;
const synth = window.speechSynthesis;
if(!synth){ document.getElementById('warn').style.display='block'; }
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Karen','Daniel'];
  voice = null;
  for(const p of pref){ const f=vs.find(v=>v.name.includes(p)); if(f){ voice=f; break; } }
  if(!voice) voice = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function say(text, done){
  if(!synth){ done&&done(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : 'en-US'; if(voice) u.voice = voice;
  u.rate = rate; u.pitch = 1;
  u.onend = ()=>done&&done(); u.onerror = ()=>done&&done();
  synth.speak(u);
}
const qs = new URLSearchParams(location.search);
const startU = (qs.get('u')||'1').toUpperCase();
unit = Math.max(0, DATA.findIndex(d=>d.key===startU));
function renderChips(){
  const c = document.getElementById('chips'); c.innerHTML='';
  DATA.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent= d.key==='S' ? '音節切分' : `第 ${d.key} 課　${d.sound}`;
    b.setAttribute('aria-pressed', i===unit); b.onclick=()=>{ stopAll(); unit=i; render(); b.scrollIntoView({inline:'center',block:'nearest'}); };
    c.appendChild(b);
  });
  const on=c.children[unit]; if(on) setTimeout(()=>on.scrollIntoView({inline:'center',block:'nearest'}),50);
}
function renderList(){
  const ul=document.getElementById('list'); ul.innerHTML='';
  DATA[unit].words.forEach(([w,z],i)=>{
    const li=document.createElement('li'); li.className='row'; li.dataset.i=i;
    li.innerHTML=`<button class="spk" aria-label="播放 ${w}">${SPK}</button><span class="w">${w}</span><span class="zh">${z||''}</span>`;
    li.onclick=()=>{ stopAll(); mark(i); say(w,()=>mark(-1)); };
    ul.appendChild(li);
  });
}
function mark(i){ document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on', +r.dataset.i===i)); }
function stopAll(){ playing=false; if(synth) synth.cancel(); mark(-1); document.getElementById('playall').textContent='全部播放'; }
document.getElementById('playall').onclick=()=>{
  if(playing){ stopAll(); return; }
  playing=true; document.getElementById('playall').textContent='停止';
  const ws=DATA[unit].words; let i=0;
  const next=()=>{ if(!playing||i>=ws.length){ stopAll(); return; }
    mark(i); const row=document.querySelector(`.row[data-i="${i}"]`); row&&row.scrollIntoView({block:'center',behavior:'smooth'});
    say(ws[i][0],()=>{ i++; setTimeout(next, 900); }); };
  next();
};
// dictation
let dq=[], di=0, miss=[], checked=false;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newRound(){ dq=shuffle(DATA[unit].words).slice(0,10); di=0; miss=[]; drawQ(); }
function drawQ(){
  const box=document.getElementById('dbox'); checked=false;
  if(di>=dq.length){
    const score=dq.length-miss.length;
    box.innerHTML=`<div class="summary"><h3>${score} / ${dq.length}</h3><div class="dcount">${miss.length? '寫錯的字，回講義找出它屬於哪一條規則：':'全對。換一課，或再來一組。'}</div>
      ${miss.length? '<div class="miss">'+miss.map(([w,z,a])=>`${w}　<span style="color:var(--soft)">${z}｜你寫 ${a||'（空白）'}</span>`).join('<br>')+'</div>':''}
      <div class="actions"><button class="btn" id="again">再來一組</button></div></div>`;
    document.getElementById('again').onclick=newRound; return;
  }
  const [w,z]=dq[di];
  box.innerHTML=`<div class="dcount">第 ${di+1} 題 / 共 ${dq.length} 題</div>
    <button class="bigplay" id="bp" aria-label="播放">${SPK}</button>
    <div class="hint" id="hint"><button class="hintbtn" id="hb">看中文提示</button></div>
    <input class="answer" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="寫出你聽到的字">
    <div class="actions"><button class="btn ghost" id="rep">再聽一次</button><button class="btn" id="chk">檢查</button></div>
    <div class="result" id="res"></div>`;
  const play=()=>say(w);
  document.getElementById('bp').onclick=play; document.getElementById('rep').onclick=play;
  document.getElementById('hb').onclick=()=>{ document.getElementById('hint').textContent=z||'（無）'; };
  const ans=document.getElementById('ans');
  const chk=document.getElementById('chk');
  const go=()=>{
    if(checked){ di++; drawQ(); return; }
    const a=ans.value.trim().toLowerCase(); checked=true;
    const res=document.getElementById('res');
    if(a===w.toLowerCase()){ res.innerHTML='<span class="ok">正確</span>'; }
    else { miss.push([w,z,a]); res.innerHTML=`<span class="no">再看一次</span><br><span class="rightw">${w}</span>`; }
    chk.textContent = di===dq.length-1 ? '看成績' : '下一題';
  };
  chk.onclick=go; ans.onkeydown=e=>{ if(e.key==='Enter') go(); };
  setTimeout(play, 250);
}
function setMode(m){
  stopAll(); mode=m;
  document.getElementById('mListen').setAttribute('aria-pressed', m==='listen');
  document.getElementById('mDict').setAttribute('aria-pressed', m==='dict');
  document.getElementById('listen').hidden = m!=='listen';
  document.getElementById('dict').hidden = m!=='dict';
  document.getElementById('playall').style.visibility = m==='listen'?'visible':'hidden';
  if(m==='dict') newRound();
}
document.getElementById('mListen').onclick=()=>setMode('listen');
document.getElementById('mDict').onclick=()=>setMode('dict');
function setRate(r){ rate=r; document.getElementById('sN').setAttribute('aria-pressed', r>0.8); document.getElementById('sS').setAttribute('aria-pressed', r<=0.8); }
document.getElementById('sN').onclick=()=>setRate(0.9);
document.getElementById('sS').onclick=()=>setRate(0.6);
function render(){
  const d=DATA[unit];
  document.getElementById('utitle').textContent= d.key==='S' ? d.title : `第 ${d.key} 課　${d.title}`;
  document.getElementById('usub').textContent=`${d.words.length} 個字`;
  renderChips(); renderList();
  if(mode==='dict') newRound();
}
render();
</script>
